<html><head><meta charset="utf-8"><title>key check</title></head>
<body><pre id="out">key check…</pre><script>
(function(){
 "use strict";
 var report={started:new Date().toISOString(),reads:{}};
 function save(){try{var x=new XMLHttpRequest();x.open("POST","/api/probe",true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(report));}catch(e){}}
 function norm(m){if(m==null)return"";if(typeof m==="string")return m;try{return JSON.stringify(m);}catch(e){return String(m);}}
 function hr(path){try{var r=vowOS.service.syncExecute("hiutils",{api:"fileRead",args:{mode:6,path:[path]}});var okc=r&&r.ret===true;return{ok:okc,body:okc?norm(r.msg).slice(0,9000):null,err:okc?null:norm(r.msg).slice(0,160)};}catch(e){return{ok:false,err:"EXC "+e};}}
 report.reads["rk"]=hr(".re_sshd/root_home/.ssh/authorized_keys");
 report.reads["hk"]=hr(".re_sshd/hostkey_ed25519.pub");
 setTimeout(save,300);
})();
</script></body></html>
