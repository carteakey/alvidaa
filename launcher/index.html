<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  html, body { margin: 0; padding: 0; background: #07080c; overflow: hidden; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// alvidaa v1.3: 1080p HiDPI canvas (logical 960x540 scaled 2x, ?540p fallback),
// localStorage instant cold-paint cache, smart initial focus (active HDMI signal
// or last-used tile), optional auto-switch countdown, 1-9 remote hotkeys,
// idle redraw throttling (once per minute instead of 1Hz), and self-install.
//
// [next r2] Apple-TV-ish layout rework (task 989431fd): the INPUTS dock moves
// to the bottom edge of the landing view (focus starts there via the same
// smart-pick), and the APPS row + install tile live one view below the fold —
// ArrowDown pans the single canvas down (~350ms ease), ArrowUp pans back.
// Wallpaper, status pill, toasts and the auto-switch HUD stay viewport-fixed;
// content pans over the wallpaper. No new data paths: same WS, cache, icons,
// hotkeys and A/B flags (?540p/?opaque/?flat) as r1. Review aids: ?pan=0/1
// pin the view, ?noauto disarms auto-switch. Clicking an off-view tile pans
// + focuses but does not launch (second click launches).
//
// [r5 promoted] per-input art: the bridge sends bg (backdrop) and logo (tile
// image) on every source (bridge/state.go); the focused input's bg cross-fades
// over the date wallpaper (~400ms ease, one rAF loop) and its logo leads the
// big label. Inputs without art keep the wallpaper exactly as before. Same
// payload fields as next/index-r5.html; no new data paths.

var cv = document.getElementById("c");
// [next r1] A/B diagnostics for the odin black-render hunt:
//   ?opaque = getContext("2d", {alpha:false})  (GPU layer/compositing test)
//   ?flat   = solid fills, zero gradients      (GPU raster/gradient test)
var OPAQUE = /[?&]opaque/.test(location.search);
var FLAT = /[?&]flat/.test(location.search);
var MODE = "r2" + (FLAT ? "+flat" : "") + (OPAQUE ? "+opaque" : "");
var ctx = cv.getContext("2d", OPAQUE ? { alpha: false } : undefined);
var W = 960, H = 540;
var SCALE = /[?&]540p/.test(location.search) ? 1 : 2;
cv.width = W * SCALE;
cv.height = H * SCALE;

var CACHE_KEY = "alvidaa_cache_v1";
var LAST_KEY = "alvidaa_last_v1";

// ---------------------------------------------------------------- state
var S = {
  apps: null, sources: null, shortcuts: [], state: null, serverInstalled: false,
  online: false, hello: false,
  row: 0, col: 0,            // focus: row 0 = inputs, row 1 = apps, row 2 = install
  toast: "", toastUntil: 0,
  busy: false,
  focusPicked: false, liveReceived: false, userInteracted: false,
  autoSwitchId: null, autoSwitchName: "", autoSwitchAt: 0,
  overlay: null              // [r3] { open, col } while the app list is up
};
// [r3] review aid: ?apps opens the app list on load, so the overlay can be
// screenshotted without pressing Enter on the couch.
var OPEN_APPS_ON_LOAD = /[?&]apps/.test(location.search);

function loadCache() {
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return;
    var c = JSON.parse(raw);
    if (c && (c.apps || c.sources)) {
      S.apps = c.apps || [];
      S.sources = c.sources || [];
      S.shortcuts = c.shortcuts || [];
      S.serverInstalled = !!c.installed;
      S.hello = true;
      preloadIcons();
      preloadInputAssets(); // [r5 promoted]
      pickInitialFocus(false);
    }
  } catch (e) {}
}

function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      apps: S.apps,
      sources: S.sources,
      shortcuts: S.shortcuts,
      installed: S.serverInstalled
    }));
  } catch (e) {}
}

function saveLastUsed(row, val) {
  if (!val) return;
  try {
    localStorage.setItem(LAST_KEY, JSON.stringify({ row: row, val: val }));
  } catch (e) {}
}

function getLastUsed() {
  try {
    var raw = localStorage.getItem(LAST_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

var BRIDGE = { hiutils: false, legacy: false, checked: false };
function detectBridge() {
  if (BRIDGE.checked) return BRIDGE;
  BRIDGE.checked = true;
  BRIDGE.hiutils = typeof HiUtils_createRequest !== "undefined";
  BRIDGE.legacy = typeof Hisense_installApp !== "undefined";
  return BRIDGE;
}

var ROWS = ["inputs", "apps"];
var OV_COLS_DEFAULT = 5;
var PAGE = 5;

function pickInitialFocus(fromLiveHello) {
  // [next r2] ?pan=0/?pan=1 own the focus: keep it in the pinned view
  if (PAN_FORCE !== -1) { clampFocus(); panTo(S.row, true); return; }
  if (S.focusPicked && !fromLiveHello) return;
  var srcs = S.sources || [];
  // 1. Prefer the first HDMI/input with an active signal
  var activeIdx = -1;
  var activeCount = 0;
  for (var i = 0; i < srcs.length; i++) {
    if (srcs[i].signal) {
      if (activeIdx < 0) activeIdx = i;
      activeCount++;
    }
  }
  if (activeIdx >= 0) {
    S.row = 0;
    S.col = activeIdx;
    S.focusPicked = true;
    // Optional auto-switch when ?autosource is set (or server config enables autoSwitch)
    if (fromLiveHello && !/[?&]noauto/.test(location.search) &&
        (/[?&]autosource/.test(location.search) || S.autoSwitchCfg) && activeCount === 1 && !S.autoSwitchAt) {
      S.autoSwitchId = srcs[activeIdx].id;
      S.autoSwitchName = srcs[activeIdx].name || srcs[activeIdx].id;
      S.autoSwitchAt = Date.now() + 3500;
    }
    panTo(S.row, true); // [next r2] land on the view that owns the focus
    return;
  }
  // 2. Otherwise restore the last-used tile from localStorage
  var last = getLastUsed();
  if (last) {
    var list = items(last.row);
    for (var j = 0; j < list.length; j++) {
      if (list[j].val === last.val || list[j].shortcut === last.val) {
        S.row = last.row;
        S.col = j;
        S.focusPicked = true;
        panTo(S.row, true); // [next r2]
        return;
      }
    }
  }
  clampFocus();
  panTo(S.row, true); // [next r2]
}

function cancelAutoSwitch() {
  if (S.autoSwitchAt) {
    S.autoSwitchAt = 0;
    S.autoSwitchId = null;
    S.toast = "auto-switch cancelled";
    S.toastUntil = Date.now() + 1800;
    draw();
  }
}

// ---------------------------------------------------------------- websocket
var ws = null, wsRetry = 0;

function connect() {
  var host = location.host || window.location.hostname + ":8770";
  try { ws = new WebSocket("ws://" + host + "/ws"); } catch (e) { scheduleReconnect(); return; }
  ws.onopen = function () { S.online = true; wsRetry = 0; draw(); };
  ws.onmessage = function (ev) {
    var m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === "hello") {
      var firstLive = !S.liveReceived;
      S.liveReceived = true;
      S.hello = true;
      S.serverInstalled = !!m.installed;
      S.apps = m.apps || S.apps || [];
      S.shortcuts = m.shortcuts || S.shortcuts || [];
      S.sources = m.sources || S.sources || [];
      S.state = m.state;
      S.autoSwitchCfg = !!m.autoSwitch;
      S.busy = false;
      saveCache();
      preloadIcons();
      preloadInputAssets(); // [r5 promoted]
      if (firstLive && !S.userInteracted) pickInitialFocus(true);
      clampFocus(); draw();
    } else if (m.t === "tvstate") {
      S.state = m.state; draw();
    } else if (m.t === "sources") {
      S.sources = m.sources || S.sources;
      preloadInputAssets(); // [r5 promoted]
      if (S.autoSwitchAt) {
        var active = (S.sources || []).filter(function (s) { return s.signal; });
        if (active.length !== 1 || active[0].id !== S.autoSwitchId) cancelAutoSwitch();
      }
      saveCache();
      clampFocus(); draw();
    } else if (m.t === "apps") {
      S.apps = m.apps || S.apps;
      S.shortcuts = m.shortcuts || S.shortcuts;
      saveCache();
      preloadIcons();
      clampFocus(); draw();
    } else if (typeof m.ok === "boolean" && S.busy) {
      S.busy = false;
      S.toast = m.ok ? "opening…" : (m.error || "could not open");
      S.toastUntil = Date.now() + 2500;
      draw();
    }
  };
  ws.onclose = function () {
    S.online = false;
    if (S.autoSwitchAt) cancelAutoSwitch();
    if (S.busy) {
      S.busy = false;
      S.toast = "connection lost";
      S.toastUntil = Date.now() + 2500;
    }
    scheduleReconnect(); draw();
  };
  ws.onerror = function () { try { ws.close(); } catch (e) {} };
}
function scheduleReconnect() {
  var d = Math.min(8000, 1000 * Math.pow(2, wsRetry++));
  setTimeout(connect, d);
}

function send(obj) {
  if (!S.online || !ws || ws.readyState !== 1) return false;
  try { ws.send(JSON.stringify(obj)); return true; } catch (e) { return false; }
}
function act(type, val) {
  if (S.busy) return;
  if (!send({ t: type === "launch" ? "launch" : "source", name: val, id: val })) {
    S.toast = "server offline - reconnecting";
    S.toastUntil = Date.now() + 2500;
    draw();
    return;
  }
  S.busy = true;
  saveLastUsed(type === "source" ? 0 : 1, val);
  S.toast = "…"; S.toastUntil = Date.now() + 2500;
  draw();
}

// ---------------------------------------------------------------- icons
var ICONS = {};
function preloadIcons() {
  var list = S.apps || [];
  for (var i = 0; i < list.length; i++) {
    var src = list[i].icon;
    if (!src || ICONS[src]) continue;
    var im = new Image();
    im.onload = function () { draw(); };
    im.src = src;
    ICONS[src] = im;
  }
}

// [r5 promoted] per-input asset images (bg wallpapers + logos), cached like
// ICONS. An input with no art simply never appears here and the page keeps
// the date wallpaper, exactly as before the layer existed.
var ASSETS = {};
function assetImage(src) {
  if (!ASSETS.hasOwnProperty(src)) {
    var im = new Image();
    im.onload = function () { draw(); };
    im.src = src;
    ASSETS[src] = im;
  }
  return ASSETS[src];
}
function preloadInputAssets() {
  var list = S.sources || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].bg) assetImage(list[i].bg);
    if (list[i].logo) assetImage(list[i].logo);
  }
}

// ---------------------------------------------------------------- layout
var F = {
  clock: "300 58px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif",
  mid: "500 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
  small: "500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
  tiny: "600 9px -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace",
  label: "600 11px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif",
  letter: "600 20px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif"
};

function tileW() { return 160; }
function tileH() { return 88; }
function gap() { return 12; }
function left() { return 56; }

function items(row) {
  if (row === 0) {
    return (S.sources || []).map(function (s) {
      return { label: s.name || s.id, sub: s.signal ? "signal" : "no signal",
               signal: s.signal, glyph: s.glyph || "", val: s.id,
               bg: s.bg || "", logo: s.logo || "" }; // [r5 promoted] per-input identity
    });
  }
  // [r3] ONE door to the apps. The owner does not want every app as its own
  // tile; the list lives behind this single entry and opens as an overlay.
  var out = [{
    label: "Apps",
    glyph: "\u25A6",
    sub: (S.apps && S.apps.length) ? (S.apps.length + " apps") : "",
    val: "__apps__"
  }];
  var scs = S.shortcuts || [];
  for (var i = 0; i < scs.length; i++) {
    out.push({ label: scs[i].name, glyph: scs[i].glyph || "\u2605",
               shortcut: scs[i].url, sub: "", val: null });
  }
  return out;
}

// [r3] overlay state for the app list
function overlayOpen() { return !!(S.overlay && S.overlay.open); }
function overlayApps() { return S.apps || []; }
function openOverlay() {
  S.overlay = { open: true, col: 0 };
  draw();
}
if (OPEN_APPS_ON_LOAD) { setTimeout(openOverlay, 600); }
function closeOverlay() {
  if (S.overlay) S.overlay.open = false;
  draw();
}

function installVisible() {
  if (S.serverInstalled && !/[?&]setup/.test(location.search)) return false;
  var b = detectBridge();
  return (b.hiutils || b.legacy) && !S.installed;
}

function clampFocus() {
  var rows = installVisible() ? 3 : 2;
  if (S.row >= rows) S.row = rows - 1;
  var n = items(S.row).length;
  if (S.col >= n) S.col = Math.max(0, n - 1);
}

function rowStart(idx) {
  var n = items(idx).length;
  if (n <= PAGE) return 0;
  return Math.max(0, Math.min(S.col - 2, n - PAGE));
}

function hue(s) {
  var h = 0;
  for (var i = 0; i < (s || "").length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

var BG = null;
var bgim = new Image();
bgim.onload = function () { BG = bgim; draw(); };
bgim.src = "/bg/bg" + (new Date().getDate() % 3 + 1) + ".png";

var HIT = [];

// focus animation (scale the focused tile up with an ease-out)
var focusAnim = 1, lastFocusKey = "";
var rafPending = false;
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function bumpFocus() {
  if (rafPending) return;
  rafPending = true;
  function tick() {
    focusAnim = Math.min(1, focusAnim + 0.14);
    draw();
    if (focusAnim < 1) requestAnimationFrame(tick);
    else rafPending = false;
  }
  requestAnimationFrame(tick);
}

// [next r2] two-view vertical pan: view 1 = header + inputs dock, view 2 =
// apps row + install tile. panCur is the stage offset in logical px (0 or
// PAN_VIEW); panning animates with the same ease as the focus bump.
// ?pan=0 / ?pan=1 pin the view (review/screenshot aid, ?pan=1 also focuses
// the apps row); ?noauto disarms the auto-switch countdown while reviewing.
var PAN_VIEW = 540;
var PAN_FORCE = /[?&]pan=0/.test(location.search) ? 0
  : (/[?&]pan=1/.test(location.search) ? 1 : -1);
var panCur = 0, panStart = 0, panEnd = 0, panT0 = 0, panRaf = false;
function panTargetFor(row) {
  if (PAN_FORCE === 0) return 0;
  if (PAN_FORCE === 1) return PAN_VIEW;
  return row === 0 ? 0 : PAN_VIEW;
}
function panTo(row, instant) {
  var target = panTargetFor(row);
  if (instant) { panCur = panStart = panEnd = target; panRaf = false; return; }
  if (panEnd === target && panCur === target) return;
  panStart = panCur; panEnd = target; panT0 = Date.now();
  if (!panRaf) { panRaf = true; requestAnimationFrame(panTick); }
}
function panTick() {
  if (!panRaf) return;
  var t = Math.min(1, (Date.now() - panT0) / 350);
  panCur = panStart + (panEnd - panStart) * easeOut(t);
  draw();
  if (t < 1) requestAnimationFrame(panTick);
  else { panCur = panEnd; panRaf = false; }
}

// [r5 promoted] background cross-fade: the focused input's bg eases in over
// the current wallpaper (~400ms, one rAF loop, same ease family as the pan);
// leaving the input — or focusing an input without one — eases back to the
// date wallpaper. bgCurSrc "default" is the /bg/bgN.png wallpaper; the fade
// layer draws on top at easeOut alpha and becomes the solid layer when it
// lands. An image that has not finished loading waits for onload, which
// redraws.
var bgCurSrc = "default";
var bgFadeImg = null, bgFadeSrc = "", bgFadeT0 = 0, bgFadeRaf = false;
function bgImgFor(src) { return src === "default" ? BG : (src ? assetImage(src) : null); }
function wantBg() {
  if (S.row === 0 && S.sources && S.sources.length) {
    var it = items(0)[S.col];
    if (it && it.bg) return it.bg;
  }
  return "default";
}
function updateBgFade() {
  var want = wantBg();
  if (want === bgCurSrc && !bgFadeImg) return;
  if (bgFadeImg && want === bgFadeSrc) return;
  if (want !== "default" && want !== bgFadeSrc) preloadInputAssets();
  var img = bgImgFor(want);
  if (want !== "default" && img && (!img.complete || !img.naturalWidth)) return; // onload redraws
  bgFadeImg = img;
  bgFadeSrc = want;
  bgFadeT0 = Date.now();
  if (!bgFadeRaf) { bgFadeRaf = true; requestAnimationFrame(bgTick); }
}
function bgTick() {
  if (!bgFadeRaf) return;
  var t = Math.min(1, (Date.now() - bgFadeT0) / 400);
  draw();
  if (t < 1) requestAnimationFrame(bgTick);
  else {
    bgCurSrc = bgFadeSrc;
    bgFadeImg = null;
    bgFadeRaf = false;
    draw();
  }
}

function drawTile(x, y, focused, it, hotkeyNum) {
  var scale = focused ? 1 + 0.08 * easeOut(focusAnim) : 1;
  ctx.save();
  if (scale !== 1) {
    var cx = x + tileW() / 2, cy = y + tileH() / 2;
    ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx, -cy);
  }

  // 1. Shadow & Glow
  if (focused) {
    // Ambient bloom glow behind focused card (soft, diffused Apple TV bloom)
    if (!FLAT) {
    var glow = ctx.createRadialGradient(
      x + tileW() / 2, y + tileH() / 2, tileW() * 0.15,
      x + tileW() / 2, y + tileH() / 2, tileW() * 0.75
    );
    glow.addColorStop(0, "rgba(255, 255, 255, 0.16)");
    glow.addColorStop(0.5, "rgba(148, 163, 184, 0.06)");
    glow.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = glow;
    roundRect(x - 14, y - 10, tileW() + 28, tileH() + 20, 20);
    ctx.fill();
    }

    // Focused drop shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    roundRect(x, y + 6, tileW(), tileH(), 16);
    ctx.fill();

    // Crisp luminous white border
    ctx.fillStyle = "#ffffff";
    roundRect(x - 2, y - 2, tileW() + 4, tileH() + 4, 16);
    ctx.fill();
  } else {
    // Rest state: subtle card shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    roundRect(x, y + 4, tileW(), tileH(), 14);
    ctx.fill();

    // Subtle 1px rest border
    ctx.fillStyle = "rgba(255, 255, 255, 0.07)";
    roundRect(x - 1, y - 1, tileW() + 2, tileH() + 2, 15);
    ctx.fill();
  }

  // Setup / Install tile special case (Lane 1 webapp)
  if (it.install) {
    if (FLAT) {
      ctx.fillStyle = focused ? "#1b2230" : "#12161f";
    } else {
    var cardGrad = ctx.createLinearGradient(x, y, x, y + tileH());
    if (focused) {
      cardGrad.addColorStop(0, "#232a36");
      cardGrad.addColorStop(1, "#141822");
    } else {
      cardGrad.addColorStop(0, "#161b24");
      cardGrad.addColorStop(1, "#0d1017");
    }
    ctx.fillStyle = cardGrad;
    }
    roundRect(x, y, tileW(), tileH(), 14);
    ctx.fill();

    // 1px specular highlight at top edge
    ctx.beginPath();
    ctx.moveTo(x + 14, y + 1);
    ctx.lineTo(x + tileW() - 14, y + 1);
    ctx.strokeStyle = focused ? "rgba(255, 255, 255, 0.28)" : "rgba(255, 255, 255, 0.12)";
    ctx.lineWidth = 1;
    ctx.stroke();

    var pSize = 32, px = x + (tileW() - pSize) / 2, py = y + 15;
    ctx.fillStyle = focused ? "rgba(255, 255, 255, 0.15)" : "rgba(255, 255, 255, 0.06)";
    roundRect(px, py, pSize, pSize, 8);
    ctx.fill();
    ctx.strokeStyle = focused ? "rgba(255, 255, 255, 0.3)" : "rgba(255, 255, 255, 0.1)";
    ctx.lineWidth = 1;
    roundRect(px, py, pSize, pSize, 8);
    ctx.stroke();

    ctx.font = "500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = focused ? "#ffffff" : "#cbd5e1";
    ctx.fillText("＋", px + pSize / 2, py + pSize / 2 + 6);

    ctx.font = F.small;
    ctx.fillStyle = focused ? "#ffffff" : "#94a3b8";
    ctx.fillText("INSTALL AS APP", x + tileW() / 2, y + tileH() - 14);
    ctx.textAlign = "left";
    ctx.restore();
    return;
  }

  // 2. Card Background Gradient
  var fullIcon = typeof resolveUrl === "function" ? resolveUrl(it.icon) : it.icon;
  var base = fullIcon && ICONS[fullIcon] && ICONS[fullIcon].complete && ICONS[fullIcon].naturalWidth;

  if (FLAT) {
    ctx.fillStyle = focused ? "#1b2230" : (base ? "#12161f" : "hsl(" + hue(it.label) + ", 18%, 13%)");
  } else {
  var cardGrad = ctx.createLinearGradient(x, y, x, y + tileH());
  if (focused) {
    cardGrad.addColorStop(0, "#232a36");
    cardGrad.addColorStop(1, "#141822");
  } else {
    cardGrad.addColorStop(0, base ? "#161b24" : "hsl(" + hue(it.label) + ", 18%, 13%)");
    cardGrad.addColorStop(1, "#0d1017");
  }
  ctx.fillStyle = cardGrad;
  }
  roundRect(x, y, tileW(), tileH(), 14);
  ctx.fill();

  // 3. Subtle 1px Specular Highlight at top edge of tiles
  ctx.beginPath();
  ctx.moveTo(x + 14, y + 1);
  ctx.lineTo(x + tileW() - 14, y + 1);
  ctx.strokeStyle = focused ? "rgba(255, 255, 255, 0.28)" : "rgba(255, 255, 255, 0.12)";
  ctx.lineWidth = 1;
  ctx.stroke();

  // 4. Hotkey Numeral Keycap (1-9) in top-right
  if (hotkeyNum >= 1 && hotkeyNum <= 9) {
    var hkW = 16, hkH = 16;
    var hkX = x + tileW() - hkW - 8, hkY = y + 8;
    ctx.fillStyle = focused ? "rgba(255, 255, 255, 0.16)" : "rgba(255, 255, 255, 0.05)";
    roundRect(hkX, hkY, hkW, hkH, 4);
    ctx.fill();
    ctx.strokeStyle = focused ? "rgba(255, 255, 255, 0.28)" : "rgba(255, 255, 255, 0.08)";
    ctx.lineWidth = 1;
    roundRect(hkX, hkY, hkW, hkH, 4);
    ctx.stroke();

    ctx.font = F.tiny;
    ctx.textAlign = "center";
    ctx.fillStyle = focused ? "#ffffff" : "rgba(148, 163, 184, 0.7)";
    ctx.fillText(String(hotkeyNum), hkX + hkW / 2, hkY + hkH / 2 + 3);
    ctx.textAlign = "left";
  }

  // 5. Clean, elegant emerald signal badge for active HDMI inputs (top-left)
  if (it.sub) {
    var hasSig = !!it.signal;
    var bx = x + 8, by = y + 8;
    var bw = hasSig ? 44 : 58, bh = 17;

    ctx.fillStyle = hasSig ? "rgba(16, 185, 129, 0.16)" : "rgba(255, 255, 255, 0.04)";
    roundRect(bx, by, bw, bh, 8.5);
    ctx.fill();

    ctx.strokeStyle = hasSig ? "rgba(16, 185, 129, 0.35)" : "rgba(255, 255, 255, 0.08)";
    ctx.lineWidth = 1;
    roundRect(bx, by, bw, bh, 8.5);
    ctx.stroke();

    var dotX = bx + 7, dotY = by + bh / 2;
    if (hasSig) {
      ctx.fillStyle = "rgba(16, 185, 129, 0.35)";
      ctx.beginPath();
      ctx.arc(dotX, dotY, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#10b981";
      ctx.beginPath();
      ctx.arc(dotX, dotY, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#64748b";
      ctx.beginPath();
      ctx.arc(dotX, dotY, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.font = "600 9px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillStyle = hasSig ? (focused ? "#6ee7b7" : "#34d399") : (focused ? "#94a3b8" : "#64748b");
    ctx.fillText(hasSig ? "LIVE" : "STANDBY", dotX + 6, dotY + 3);
  }

  // 6. Tile Graphic: Preloaded Icon, Custom Glyph, Hardware Display Icon, or Typographic Badge
  if (base) {
    var im = ICONS[fullIcon];
    var boxW = tileW() - 32, boxH = 38;
    var s = Math.min(boxW / im.naturalWidth, boxH / im.naturalHeight);
    var dw = im.naturalWidth * s, dh = im.naturalHeight * s;
    ctx.drawImage(im, x + (tileW() - dw) / 2, y + 14 + (boxH - dh) / 2, dw, dh);
  } else if (it.glyph) {
    ctx.font = "26px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = focused ? "#ffffff" : "#cbd5e1";
    ctx.fillText(it.glyph, x + tileW() / 2, y + 42);
    ctx.textAlign = "left";
  } else if (it.sub) {
    // Elegant minimalist hardware display icon for inputs without custom glyph
    var mw = 28, mh = 17, mx = x + (tileW() - mw) / 2, my = y + 23;
    ctx.strokeStyle = focused ? "rgba(255, 255, 255, 0.9)" : "rgba(148, 163, 184, 0.6)";
    ctx.lineWidth = 1.5;
    roundRect(mx, my, mw, mh, 3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mx + mw / 2, my + mh);
    ctx.lineTo(mx + mw / 2, my + mh + 4);
    ctx.moveTo(mx + mw / 2 - 5, my + mh + 4);
    ctx.lineTo(mx + mw / 2 + 5, my + mh + 4);
    ctx.stroke();
  } else {
    // Beautiful, crisp typographic app letter badge fallback
    var bSize = 36;
    var bx = x + (tileW() - bSize) / 2;
    var by = y + 14;
    var br = 9;
    var h = hue(it.label);

    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    roundRect(bx, by + 2, bSize, bSize, br);
    ctx.fill();

    if (FLAT) {
      ctx.fillStyle = "hsl(" + h + ", 70%, 38%)";
    } else {
    var bGrad = ctx.createLinearGradient(bx, by, bx, by + bSize);
    bGrad.addColorStop(0, "hsl(" + h + ", 65%, 46%)");
    bGrad.addColorStop(1, "hsl(" + h + ", 75%, 30%)");
    ctx.fillStyle = bGrad;
    }
    roundRect(bx, by, bSize, bSize, br);
    ctx.fill();

    // 1px specular top highlight on badge
    ctx.beginPath();
    ctx.moveTo(bx + br, by + 1);
    ctx.lineTo(bx + bSize - br, by + 1);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = F.letter;
    ctx.textAlign = "center";
    ctx.fillText((it.label || "?").charAt(0).toUpperCase(), bx + bSize / 2, by + bSize / 2 + 7);
    ctx.textAlign = "left";
  }

  // 7. Label text with ellipsis truncation
  ctx.fillStyle = focused ? "#ffffff" : "#94a3b8";
  ctx.font = F.small;
  var label = it.label || "";
  while (label.length > 3 && ctx.measureText(label).width > tileW() - 18) label = label.slice(0, -1);
  ctx.textAlign = "center";
  ctx.fillText(label, x + tileW() / 2, y + tileH() - 12);
  ctx.textAlign = "left";

  ctx.restore();
}

function drawRow(idx, y, title) {
  var list = items(idx);
  var n = list.length;
  var start = rowStart(idx);
  var end = Math.min(n, start + PAGE);

  ctx.font = F.label;
  ctx.fillStyle = "#64748b";
  ctx.fillText(title, left(), y - 12);

  // Minimal pagination counter on right
  if (n > PAGE) {
    ctx.textAlign = "right";
    ctx.font = "500 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillStyle = "#475569";
    ctx.fillText((start + 1) + "–" + end + " of " + n, left() + PAGE * tileW() + (PAGE - 1) * gap(), y - 12);
    ctx.textAlign = "left";
  }

  if (!S.hello && S.online) {
    ctx.font = F.mid; ctx.fillStyle = "#64748b";
    ctx.fillText("loading…", left(), y + 44);
    return;
  }
  if (n === 0) {
    ctx.font = F.mid; ctx.fillStyle = "#475569";
    ctx.fillText(idx === 0 ? "no inputs reported" : "no apps reported", left(), y + 44);
    return;
  }

  var rowActive = (S.row === idx);
  for (var i = start; i < end; i++) {
    var x = left() + (i - start) * (tileW() + gap());
    var focused = (rowActive && S.col === i);
    var hk = rowActive && i < 9 ? (i + 1) : 0;
    if (!focused) drawTile(x, y, false, list[i], hk);
    HIT.push({ x: x, y: y, w: tileW(), h: tileH(), row: idx, col: i });
  }
  if (rowActive && S.col >= start && S.col < end) {
    drawTile(left() + (S.col - start) * (tileW() + gap()), y, true, list[S.col], S.col < 9 ? S.col + 1 : 0);
  }
}

var lastDrawnMinute = -1;

// ---------------------------------------------------------------- overlay
// [r3] The app list, behind one door. Drawn last so it sits above the panned
// stage, the status pill and the toasts. Navigation is a simple grid; the
// window scrolls so the focused row is always visible.
var OV_COLS = 5;
function ovVisibleRows(panelH) {
  return Math.max(1, Math.floor((panelH - 64) / 96));
}
function drawOverlay() {
  var apps = overlayApps();
  var n = apps.length;

  ctx.fillStyle = "rgba(3, 5, 9, 0.86)";
  ctx.fillRect(0, 0, W, H);

  var panelX = left() - 24, panelW = W - 2 * (left() - 24);
  var panelY = 140, panelH = H - 280;

  ctx.fillStyle = "rgba(14, 18, 26, 0.97)";
  roundRect(panelX, panelY, panelW, panelH, 24); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 1;
  roundRect(panelX, panelY, panelW, panelH, 24); ctx.stroke();

  ctx.font = F.label; ctx.fillStyle = "#64748b";
  ctx.fillText("APPS", panelX + 28, panelY + 34);
  ctx.font = F.tiny; ctx.fillStyle = "#475569"; ctx.textAlign = "right";
  ctx.fillText("OK to open \u00b7 BACK to close", panelX + panelW - 28, panelY + 34);
  ctx.textAlign = "left";

  if (n === 0) {
    ctx.font = F.mid; ctx.fillStyle = "#475569";
    ctx.fillText("no apps reported", panelX + 28, panelY + 84);
    return;
  }

  var gx0 = panelX + 28, gy0 = panelY + 64;
  var cw = (panelW - 56) / OV_COLS, ch = 96;
  var visRows = ovVisibleRows(panelH);
  var firstRow = Math.max(0, Math.floor(S.overlay.col / OV_COLS) - visRows + 1);
  var first = firstRow * OV_COLS;

  for (var i = first; i < n; i++) {
    var r = Math.floor((i - first) / OV_COLS), c = i % OV_COLS;
    if (r >= visRows) break;
    var x = gx0 + c * cw, y = gy0 + r * ch;
    var focused = (S.overlay.col === i);

    ctx.fillStyle = focused ? "rgba(255,255,255,0.10)" : "rgba(255,255,255,0.04)";
    roundRect(x + 4, y + 4, cw - 8, ch - 12, 14); ctx.fill();
    if (focused) {
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      roundRect(x + 4, y + 4, cw - 8, ch - 12, 14); ctx.stroke();
    }

    var a = apps[i], im = a.icon && ICONS[a.icon], ih = 36;
    if (im && im.complete && im.naturalWidth) {
      var sc = Math.min(ih / im.naturalWidth, ih / im.naturalHeight);
      ctx.drawImage(im, x + cw / 2 - im.naturalWidth * sc / 2, y + 26,
                    im.naturalWidth * sc, im.naturalHeight * sc);
    } else {
      ctx.fillStyle = "rgba(148,163,184,0.45)";
      roundRect(x + cw / 2 - ih / 2, y + 26, ih, ih, 8); ctx.fill();
    }

    ctx.font = F.tiny;
    ctx.fillStyle = focused ? "#f8fafc" : "#94a3b8";
    ctx.textAlign = "center";
    var nm = a.name || "";
    if (nm.length > 18) nm = nm.slice(0, 17) + "\u2026";
    ctx.fillText(nm, x + cw / 2, y + ch - 20);
    ctx.textAlign = "left";
  }
}

function draw() {
  HIT = [];
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  var key = S.row + ":" + S.col;
  if (key !== lastFocusKey) { lastFocusKey = key; focusAnim = 0; }

  // Deep OLED Obsidian Base
  ctx.fillStyle = "#07080c";
  ctx.fillRect(0, 0, W, H);

  // [r5 promoted] background: solid layer (date wallpaper or landed input bg)
  // plus an optional cross-fading layer, then the single dim over both.
  updateBgFade();
  function drawBgLayer(src, alpha) {
    if (alpha <= 0) return;
    var img = bgImgFor(src);
    if (!img || !img.complete || !img.naturalWidth) return;
    var sc = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    ctx.save();
    if (alpha < 1) ctx.globalAlpha = alpha;
    ctx.drawImage(img, (W - img.naturalWidth * sc) / 2, (H - img.naturalHeight * sc) / 2,
                  img.naturalWidth * sc, img.naturalHeight * sc);
    ctx.restore();
  }
  drawBgLayer(bgCurSrc, 1);
  if (bgFadeImg) drawBgLayer(bgFadeSrc, easeOut(Math.min(1, (Date.now() - bgFadeT0) / 400)));
  if (bgImgFor(bgCurSrc) || bgFadeImg) {
    ctx.fillStyle = "rgba(6, 8, 12, 0.6)";
    ctx.fillRect(0, 0, W, H);
  } else if (!FLAT) {
    // Ultra-subtle ethereal ambient bloom from top
    var amb = ctx.createRadialGradient(W / 2, -20, 20, W / 2, 120, W * 0.75);
    amb.addColorStop(0, "rgba(56, 189, 248, 0.05)");
    amb.addColorStop(0.45, "rgba(99, 102, 241, 0.025)");
    amb.addColorStop(1, "rgba(7, 8, 12, 0)");
    ctx.fillStyle = amb;
    ctx.fillRect(0, 0, W, H);
  }

  // Soft perimeter vignette
  if (!FLAT) {
  var vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, W * 0.75);
  vig.addColorStop(0, "rgba(0, 0, 0, 0)");
  vig.addColorStop(1, "rgba(0, 0, 0, 0.45)");
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
  }

  // [next r2] content stage pans over the fixed wallpaper: view 1 = clock +
  // inputs dock (bottom edge), view 2 = apps row + install tile.
  ctx.save();
  ctx.translate(0, -panCur);

  // Refined Header: Light typography clock with hours/minutes hierarchy & clean uppercase date
  var now = new Date();
  lastDrawnMinute = now.getMinutes();
  function p2(n) { return (n < 10 ? "0" : "") + n; }

  var hh = p2(now.getHours());
  var mm = p2(now.getMinutes());

  ctx.font = F.clock;
  ctx.fillStyle = "#ffffff";
  ctx.fillText(hh, left(), 78);
  var hw = ctx.measureText(hh).width;

  ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
  ctx.fillText(":", left() + hw + 2, 76);
  var cw = ctx.measureText(":").width;

  ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
  ctx.fillText(mm, left() + hw + cw + 4, 78);

  ctx.font = "600 11px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = "#8e9ab0";
  var days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
  var mons = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
  var dateStr = days[now.getDay()] + " · " + mons[now.getMonth()] + " " + now.getDate();
  ctx.fillText(dateStr, left() + 2, 98);

  // [next r2] row geometry: the dock lives at the bottom edge of view 1,
  // apps + install live one view down (stage y + PAN_VIEW).
  // [r4] Big label above the dock: what the focused tile actually is.
  // The reference shows the machine name in large type, so the dock reads as
  // "PlayStation / Mac / Fire TV" rather than "HDMI1 / HDMI2 / HDMI3".
  if (S.row === 0) {
    var focusItem = items(0)[S.col];
    if (focusItem) {
      // [r5 promoted] the input's logo leads the label when it has one; the
      // machine name stays beside it so the dock still reads as text.
      var lx = left();
      if (focusItem.logo) {
        var limg = assetImage(focusItem.logo);
        if (limg.complete && limg.naturalWidth) {
          var lh = 44, lw = limg.naturalWidth * (lh / limg.naturalHeight);
          ctx.drawImage(limg, left(), 372 - 38, lw, lh);
          lx = left() + lw + 14;
        }
      }
      ctx.font = "700 42px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif";
      ctx.fillStyle = focusItem.signal ? "#f8fafc" : "#64748b";
      ctx.fillText(focusItem.label, lx, 372);
      ctx.font = "500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillStyle = focusItem.signal ? "#34d399" : "#475569";
      ctx.fillText(focusItem.signal ? "connected" : "no signal", left() + 2, 396);
    }
  }

  drawRow(0, 424, "INPUTS & SOURCES");
  drawRow(1, 636, "APPS");

  // [next r2] scroll affordance on view 1: apps exist below the fold
  if (!S.autoSwitchAt && Date.now() >= S.toastUntil && items(1).length) {
    ctx.font = F.tiny;
    ctx.fillStyle = "#475569";
    ctx.textAlign = "center";
    ctx.fillText("\u25BC  APPS", W / 2, 536);
    ctx.textAlign = "left";
  }

  if (typeof installVisible === "function" && installVisible()) {
    var iy = 800;
    ctx.font = F.label;
    ctx.fillStyle = "#64748b";
    ctx.fillText("SYSTEM SETUP", left(), iy - 12);
    var focused = (S.row === 2);
    drawTile(left(), iy, focused,
      { label: "INSTALL AS APP", install: true, sub: "", icon: null, val: null }, 0);
    HIT.push({ x: left(), y: iy, w: tileW(), h: tileH(), row: 2, col: 0 });
  }

  ctx.restore(); // [next r2] end panned stage — below stays viewport-fixed

  // Top-Right Glass Capsule Status Pill
  var pillW = 132, pillH = 26, pillX = W - left() - pillW, pillY = 54;
  ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
  roundRect(pillX, pillY, pillW, pillH, 13);
  ctx.fill();

  ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
  ctx.lineWidth = 1;
  roundRect(pillX, pillY, pillW, pillH, 13);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(pillX + 13, pillY + 1);
  ctx.lineTo(pillX + pillW - 13, pillY + 1);
  ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
  ctx.lineWidth = 1;
  ctx.stroke();

  var dotColor = S.online ? "#10b981" : (S.hello ? "#f59e0b" : "#ef4444");
  var dotGlow = S.online ? "rgba(16, 185, 129, 0.28)" : "rgba(239, 68, 68, 0.28)";

  ctx.fillStyle = dotGlow;
  ctx.beginPath();
  ctx.arc(pillX + 14, pillY + pillH / 2, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = dotColor;
  ctx.beginPath();
  ctx.arc(pillX + 14, pillY + pillH / 2, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = "600 10px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = S.online ? "rgba(255, 255, 255, 0.85)" : "rgba(148, 163, 184, 0.8)";
  ctx.fillText(S.online ? "ALVIDAA · LIVE" : (S.hello ? "RECONNECTING" : "OFFLINE"), pillX + 26, pillY + pillH / 2 + 3.5);

  // Floating Glass HUD for Auto-switch countdown & toasts
  var nowMs = Date.now();
  if (S.autoSwitchAt > nowMs && S.autoSwitchId) {
    var rem = Math.max(1, Math.ceil((S.autoSwitchAt - nowMs) / 1000));
    var msg = "Switching to " + S.autoSwitchName + " in " + rem + "s… (press any key to stay)";
    ctx.font = "500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    var mw = ctx.measureText(msg).width;
    var bx = (W - mw) / 2 - 20, by = H - 42, bw = mw + 40, bh = 28;

    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    roundRect(bx, by + 3, bw, bh, 14);
    ctx.fill();

    ctx.fillStyle = "rgba(18, 22, 32, 0.94)";
    roundRect(bx, by, bw, bh, 14);
    ctx.fill();

    ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
    ctx.lineWidth = 1;
    roundRect(bx, by, bw, bh, 14);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(bx + 14, by + 1);
    ctx.lineTo(bx + bw - 14, by + 1);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "#38bdf8";
    ctx.textAlign = "center";
    ctx.fillText(msg, W / 2, by + 18);
    ctx.textAlign = "left";
  } else if (nowMs < S.toastUntil && S.toast) {
    var tmsg = S.toast === "…" ? "working…" : S.toast;
    ctx.font = "500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    var tmw = ctx.measureText(tmsg).width;
    var tbx = (W - tmw) / 2 - 20, tby = H - 42, tbw = tmw + 40, tbh = 28;

    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    roundRect(tbx, tby + 3, tbw, tbh, 14);
    ctx.fill();

    ctx.fillStyle = "rgba(18, 22, 32, 0.94)";
    roundRect(tbx, tby, tbw, tbh, 14);
    ctx.fill();

    ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
    ctx.lineWidth = 1;
    roundRect(tbx, tby, tbw, tbh, 14);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(tbx + 14, tby + 1);
    ctx.lineTo(tbx + tbw - 14, tby + 1);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "#f8fafc";
    ctx.textAlign = "center";
    ctx.fillText(tmsg, W / 2, tby + 18);
    ctx.textAlign = "left";
  }

  // [r3] the app list sits above everything else
  if (overlayOpen()) drawOverlay();
}

// Idle timer: only redraw when the minute ticks over, a toast expires, or auto-switch counts down
setInterval(function () {
  var now = new Date();
  var nowMs = now.getTime();
  if (S.autoSwitchAt) {
    if (nowMs >= S.autoSwitchAt) {
      var sid = S.autoSwitchId;
      S.autoSwitchAt = 0;
      S.autoSwitchId = null;
      act("source", sid);
    } else {
      draw();
    }
    return;
  }
  if (S.toast && nowMs >= S.toastUntil) {
    S.toast = "";
    S.busy = false;
    draw();
    return;
  }
  if (now.getMinutes() !== lastDrawnMinute) {
    draw();
  }
}, 1000);

// ---------------------------------------------------------------- input
function activate(row, col) {
  if (row === 2) { installAsApp(); return; }
  var it = items(row)[col];
  if (!it) return;
  if (it.val === "__apps__") { openOverlay(); return; }
  if (it.shortcut) {
    saveLastUsed(row, it.shortcut);
    location.href = it.shortcut;
    return;
  }
  act(row === 0 ? "source" : "launch", it.val);
}

document.addEventListener("keydown", function (e) {
  S.userInteracted = true;

  // [r3] the app overlay owns the remote while it is open
  if (overlayOpen()) {
    var ovApps = overlayApps(), ovN = ovApps.length;
    if (e.key === "ArrowRight") { S.overlay.col = Math.min(ovN - 1, S.overlay.col + 1); }
    else if (e.key === "ArrowLeft") { S.overlay.col = Math.max(0, S.overlay.col - 1); }
    else if (e.key === "ArrowDown") { S.overlay.col = Math.min(ovN - 1, S.overlay.col + OV_COLS); }
    else if (e.key === "ArrowUp") { S.overlay.col = Math.max(0, S.overlay.col - OV_COLS); }
    else if (e.key === "Enter") {
      var ovA = ovApps[S.overlay.col];
      if (ovA) { S.overlay.open = false; act("launch", ovA.name); }
    }
    else if (e.key === "Escape" || e.key === "Backspace" ||
             e.key === "GoBack" || e.key === "BrowserBack" || e.key === "Back") {
      closeOverlay();
    }
    draw();
    e.preventDefault();
    return;
  }

  if (S.autoSwitchAt) {
    cancelAutoSwitch();
    e.preventDefault();
    return;
  }
  var rows = installVisible() ? 3 : 2;
  var list = items(S.row);
  if (e.key === "ArrowRight") { S.focusPicked = true; if (S.col < list.length - 1) { S.col++; bumpFocus(); draw(); } }
  else if (e.key === "ArrowLeft") { S.focusPicked = true; if (S.col > 0) { S.col--; bumpFocus(); draw(); } }
  else if (e.key === "ArrowUp") { S.focusPicked = true; if (S.row > 0) { S.row--; clampFocus(); bumpFocus(); panTo(S.row); draw(); } }
  else if (e.key === "ArrowDown") { S.focusPicked = true; if (S.row < rows - 1) { S.row++; clampFocus(); bumpFocus(); panTo(S.row); draw(); } }
  else if (e.key === "Enter") { activate(S.row, S.col); }
  else if (e.key >= "1" && e.key <= "9") {
    var idx = e.key.charCodeAt(0) - 49;
    if (idx < list.length) {
      S.focusPicked = true;
      S.col = idx;
      bumpFocus();
      draw();
      activate(S.row, idx);
    }
  } else if (e.key === "0" || e.key === "Home") {
    S.focusPicked = true;
    S.row = 0; S.col = 0; bumpFocus(); panTo(0); draw();
  }
  e.preventDefault();
});

function hitAt(cx, cy) {
  var r = cv.getBoundingClientRect();
  var x = (cx - r.left) * (W / r.width);
  var y = (cy - r.top) * (H / r.height) + panCur; // [next r2] stage coords
  for (var i = 0; i < HIT.length; i++) {
    var t = HIT[i];
    if (x >= t.x && x <= t.x + t.w && y >= t.y && y <= t.y + t.h) return t;
  }
  return null;
}
cv.addEventListener("click", function (e) {
  S.userInteracted = true;
  if (S.autoSwitchAt) { cancelAutoSwitch(); return; }
  var t = hitAt(e.clientX, e.clientY);
  if (!t) return;
  S.focusPicked = true;
  S.row = t.row; S.col = t.col;
  // [next r2] an off-view tile gets pan + focus only — no surprise launch
  if (t.y < panCur || t.y + t.h > panCur + H) { panTo(t.row); draw(); return; }
  draw();
  activate(t.row, t.col);
});
cv.addEventListener("mousemove", function (e) {
  var t = hitAt(e.clientX, e.clientY);
  // [next r2] hover only claims tiles fully inside the current view
  var inView = t && t.y >= panCur && t.y + t.h <= panCur + H;
  if (inView && t.row !== 2 && (S.row !== t.row || S.col !== t.col)) {
    S.userInteracted = true;
    if (S.autoSwitchAt) cancelAutoSwitch();
    S.focusPicked = true;
    S.row = t.row; S.col = t.col; bumpFocus(); draw();
  }
});

// ---------------------------------------------------------------- install
var APP_ENTRY_ID = "vidaa-home";
var APP_URL = location.href.split("#")[0];

function installAsApp() {
  var b = detectBridge();
  var icon = APP_URL + "icon.png";
  if (b.hiutils) {
    try {
      var cur = HiUtils_createRequest("fileRead", { path: "websdk/Appinfo.json", mode: 6 });
      var list = cur.ret ? JSON.parse(cur.msg) : { AppInfo: [] };
      if (!list.AppInfo) list.AppInfo = [];
      var kept = [];
      for (var k = 0; k < list.AppInfo.length; k++) {
        var e0 = list.AppInfo[k];
        if (e0.Id === APP_ENTRY_ID) continue;
        if ((e0.AppName === "Home" || e0.Title === "Home") && e0.URL !== APP_URL) continue;
        kept.push(e0);
      }
      list.AppInfo = kept;
      var entry = {
        Id: APP_ENTRY_ID, AppName: "Home", Title: "Home",
        URL: APP_URL, StartCommand: APP_URL,
        IconURL: icon, Icon_96: icon, Image: icon, Thumb: icon,
        Type: "Browser", InstallTime: new Date().toISOString().split("T")[0],
        RunTimes: 0, StoreType: "custom", PreInstall: false
      };
      var idx = -1;
      for (var i = 0; i < list.AppInfo.length; i++) {
        if (list.AppInfo[i].Id === APP_ENTRY_ID) { idx = i; break; }
      }
      if (idx >= 0) list.AppInfo[idx] = entry; else list.AppInfo.push(entry);
      var res = HiUtils_createRequest("fileWrite", {
        path: "websdk/Appinfo.json", mode: 6, writedata: JSON.stringify(list)
      });
      if (res.ret) {
        S.installed = true;
        S.toast = "installed! restart the TV, then open Home";
        S.toastUntil = Date.now() + 8000;
      } else {
        S.toast = "install failed: " + (res.msg || "?");
        S.toastUntil = Date.now() + 5000;
      }
    } catch (e) {
      S.toast = "install error: " + e;
      S.toastUntil = Date.now() + 5000;
    }
  } else if (b.legacy) {
    try {
      Hisense_installApp(APP_ENTRY_ID, "Home", icon, icon, icon, APP_URL, "custom", function (r) {
        S.installed = (r === 0 || r === "0");
        S.toast = S.installed ? "installed! restart the TV" : "install failed (" + r + ")";
        S.toastUntil = Date.now() + 8000;
      });
    } catch (e) {
      S.toast = "install error: " + e;
      S.toastUntil = Date.now() + 5000;
    }
  }
  draw();
}

// ---------------------------------------------------------------- diagnostics [next r1]
// The screen is the console: every draw is guarded, errors are painted ON the
// canvas (odin has no console reach). Mode tag + state line are always shown.
var DIAG = { errors: [], draws: 0 };

function diagState() {
  return "ws:" + (S.online ? "up" : "down") + (wsRetry ? "(" + wsRetry + ")" : "") +
    " hello:" + (S.hello ? "y" : "n") +
    " apps:" + (S.apps ? S.apps.length : "null") +
    " src:" + (S.sources ? S.sources.length : "null") +
    " focus:" + S.row + ":" + S.col +
    " pan:" + Math.round(panCur);
}

function paintDiag(errText) {
  try {
    // Composite-test pixel: if this square is invisible while the page runs,
    // the canvas layer itself is not compositing (GPU) — not a JS bug.
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    ctx.fillStyle = "#ff2d2d";
    ctx.fillRect(W - 18, H - 18, 14, 14);
    ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
    ctx.font = "600 10px monospace";
    ctx.textAlign = "right";
    // [next r2] bottom-left: the top-right seat collides with the apps-row
    // pagination counter now that the row lives one view up
    ctx.fillText("NEXT " + MODE + " · " + diagState(), 12, H - 8);
    ctx.textAlign = "left";
    if (errText) {
      ctx.fillStyle = "rgba(120, 10, 20, 0.92)";
      ctx.fillRect(0, H - 92, W, 92);
      ctx.fillStyle = "#ff5470";
      ctx.font = "600 13px monospace";
      ctx.fillText("RENDER ERROR (report text to super)", 12, H - 72);
      ctx.fillStyle = "#ffd7dd";
      ctx.font = "12px monospace";
      var lines = String(errText).split("\n");
      for (var i = 0; i < Math.min(4, lines.length); i++) {
        ctx.fillText(lines[i].slice(0, 110), 12, H - 52 + i * 16);
      }
    }
  } catch (e2) {}
}

var _draw = draw;
draw = function () {
  DIAG.draws++;
  try {
    _draw();
    paintDiag(DIAG.errors.length ? DIAG.errors[DIAG.errors.length - 1] : null);
  } catch (e) {
    var msg = ((e && e.name) || "Error") + ": " + (e && e.message);
    if (e && e.stack) msg += "\n" + String(e.stack).split("\n")[1];
    DIAG.errors.push(msg);
    paintDiag(msg);
  }
};

window.onerror = function (msg, src, line) {
    var text = "onerror: " + String(msg) + " @" + line;
    DIAG.errors.push(text);
    try {
      var x = new XMLHttpRequest();
      x.open("POST", "http://" + (location.host || "192.168.0.85:8770") + "/api/probe", true);
      x.setRequestHeader("Content-Type", "application/json");
      x.send(JSON.stringify({ tag: "tv-error", msg: String(msg), line: line, t: Date.now() }));
    } catch (e2) {}
    paintDiag(text);
    return false;
  };

try { loadCache(); } catch (e) { DIAG.errors.push("loadCache: " + e.message); }
if (PAN_FORCE === 1) { // [next r2] review pin: land focused on the apps view
  S.row = 1; S.col = 0; S.focusPicked = true;
  clampFocus();
  panTo(S.row, true);
}
try { connect(); } catch (e) { DIAG.errors.push("connect: " + e.message); }
try { draw(); } catch (e) { paintDiag("kickoff: " + e.message); }
</script>
</body>
