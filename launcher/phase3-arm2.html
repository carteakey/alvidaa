<html><head><meta charset="utf-8"><title>arm2</title></head>
<body><pre id="out">arm2…</pre><script>
(function(){
 "use strict";
 var out=document.getElementById("out");
 var report={started:new Date().toISOString(),steps:{}};
 function save(){try{var x=new XMLHttpRequest();x.open("POST","/api/probe",true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(report));}catch(e){}}
 function line(t){out.textContent=out.textContent+"\n"+t;}
 function syncExec(svc,obj){try{return vowOS.service.syncExecute(svc,obj);}catch(e){return{ret:false,msg:"EXC "+e.message};}}
 function hr(path){try{var r=syncExec("hiutils",{api:"fileRead",args:{mode:6,path:[path]}});var okc=r&&r.ret===true;return{ok:okc,body:okc?String(r.msg).slice(0,8000):null,err:okc?null:String(r.msg).slice(0,140)};}catch(e){return{ok:false,err:"EXC "+e};}}
 var FN="http://localhost:9009/function/basic/fetch/sw2";
 setTimeout(function(){
  // fresh uninstall (idempotent) + real install; the ipk was fetched at 19:09 (freeze-first build)
  var L=[{item:"48:54:48;re.installer"},
         {item:"49:53:49;/APPS/installer.ipk;re.installer;"}];
  var x=new XMLHttpRequest();x.open("POST",FN,true);x.setRequestHeader("Content-Type","application/json");
  x.onload=function(){report.steps.trigger=String(x.responseText||"").slice(0,2500);line("trigger: "+report.steps.trigger.slice(0,900));poll(0);};
  x.onerror=function(){report.steps.trigger="xhr err";save();};
  x.send(JSON.stringify({list:L}));
  var n=0;
  function poll(k){
    if(k>11){line("poll exhausted");save();return;}
    setTimeout(function(){
      var lg=hr(".re_sshd/installer_log.txt");
      report.steps["log_"+k]=lg;
      if(lg.ok){line("installer_log try"+k+": OK — check report; then TCP 8008 from the server.");save();return;}
      var rf=hr("../tmp/ipk_install_result");
      report.steps["res_"+k]=rf;
      line("poll "+k+": "+(rf.ok?String(rf.body).slice(0,200):"quiet"));
      if(rf.ok&&String(rf.body).indexOf('"code":400')!==-1){line("install refuted (400) — check report");save();return;}
      poll(k+1);
    },5000);
  }
 },300);
})();
</script></body></html>
