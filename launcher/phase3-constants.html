<!doctype html>
<!-- Paced constants probe for the 55E7QTUK superwatch chain (one call per
     ~1.3 s beat: rapid fileRead bursts jam the bridge; binary reads kill it
     — both measured on this build). TEXT files only.
     Reads: vendor pkgmgr PackageInstall.js (install command id),
     serviceList manifests (basic+system), opkg.conf (arch/feed). -->
<html><head><meta charset="utf-8"><title>constants</title></head>
<body><pre id="out">constants…</pre><script>
(function () {
  "use strict";
  var out = document.getElementById("out");
  var report = { started: new Date().toISOString(), reads: {} };
  function save() { try { var x = new XMLHttpRequest(); x.open("POST", "/api/probe", true); x.setRequestHeader("Content-Type", "application/json"); x.send(JSON.stringify(report)); } catch (e) {} }
  function norm(m) { if (m == null) return ""; if (typeof m === "string") return m; try { return JSON.stringify(m); } catch (e) { return String(m); } }
  function hr(path) {
    try {
      var r = vowOS.service.syncExecute("hiutils", { api: "fileRead", args: { mode: 6, path: [path] } });
      var okc = r && r.ret === true;
      return { path: path, ok: okc, body: okc ? norm(r.msg).slice(0, 65536) : null,
               err: okc ? null : norm(r.msg).slice(0, 160) };
    } catch (e) { return { path: path, ok: false, err: "EXC " + e }; }
  }
  var TARGETS = [
    "pkgs/tv.vidaa.jsservice.system/CHA/pkgmgr/PackageInstall.js",
    "pkgs/tv.vidaa.jsservice.system/CHA/serviceList.json",
    "pkgs/tv.vidaa.jsservice.basic/CHA/serviceList.json",
    "../opt/apps/opt-pkgs/opkg.conf"
  ];
  var beat = 0;
  (function next() {
    if (beat >= TARGETS.length) { save(); out.textContent += "\n[reported]"; return; }
    var p = TARGETS[beat];
    var r = hr(p);
    report.reads[p] = r;
    out.textContent += "\n" + p + ": " + (r.ok ? "OK(" + (r.body || "").length + "b)" : "fail " + String(r.err).slice(0, 90));
    if (r.ok && p.indexOf("opkg.conf") === -1) {
      // surface install-command ids and service names from text files
      var b = r.body;
      var m = b.match(/IPK_INSTALL_COMMAND[^\n]{0,80}|COMMAND[^\n]{0,60}(?:INSTALL|install)[^\n]{0,40}/g) || [];
      report.reads[p].cmdids = m.slice(0, 8);
    } else if (r.ok) {
      report.reads[p].body = r.body;
    }
    beat++;
    setTimeout(next, 1300);
  })();
})();
</script></body></html>
