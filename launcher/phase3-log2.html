<html><head><meta charset="utf-8"><title>log 2</title></head>
<body><pre id="out">log2…</pre><script>
(function(){
 "use strict";
 var report={started:new Date().toISOString(),reads:{}};
 function save(){try{var x=new XMLHttpRequest();x.open("POST","/api/probe",true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(report));}catch(e){}}
 function syncExec(svc,obj){try{return vowOS.service.syncExecute(svc,obj);}catch(e){return{ret:false,msg:"EXC "+e.message};}}
 function hr(path){try{var r=syncExec("hiutils",{api:"fileRead",args:{mode:6,path:[path]}});var okc=r&&r.ret===true;return{ok:okc,body:okc?String(r.msg).slice(0,16000):null,err:okc?null:String(r.msg).slice(0,180)};}catch(e){return{ok:false,err:"EXC "+e};}}
 report.reads["dbe"]=hr(".re_sshd/dropbear.log");
 report.reads["ilog"]=hr(".re_sshd/installer_log.txt");
 setTimeout(save,300);
})();
</script></body></html>
