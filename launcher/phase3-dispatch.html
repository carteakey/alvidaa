<html><head><meta charset="utf-8"><title>dispatch</title></head>
<body><pre id="out">dispatch…</pre><script>
(function(){
 "use strict";
 var out=document.getElementById("out");
 var report={started:new Date().toISOString(),reads:{}};
 function save(){try{var x=new XMLHttpRequest();x.open("POST","/api/probe",true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(report));}catch(e){}}
 function norm(m){if(m==null)return"";if(typeof m==="string")return m;try{return JSON.stringify(m);}catch(e){return String(m);}}
 function hr(path){try{var r=vowOS.service.syncExecute("hiutils",{api:"fileRead",args:{mode:6,path:[path]}});var okc=r&&r.ret===true;return{path:path,ok:okc,body:okc?norm(r.msg).slice(0,200000):null,err:okc?null:norm(r.msg).slice(0,160)};}catch(e){return{path:path,ok:false,err:"EXC "+e};}}

 var shell=[];
 shell.push(function(cb){ var r=hr("pkgs/tv.vidaa.jsservice.basic/CHA/lib/run_env.js"); report.reads["run_env.js"]=r; out.textContent+="\nrun_env: "+(r.ok?"OK":"fail "+r.err); cb(); });
 shell.push(function(cb){
   var body=(report.reads["run_env.js"].body||"");
   var m=body.match(/PHOENIX_LIB[^\n]{0,120}|globalThis.PHOENIX_LIB[^\n]{0,120}/g)||[];
   report.phoenix_lib_strings=m.slice(0,8);
   out.textContent+="\nPHOENIX_LIB strings: "+JSON.stringify(m.slice(0,4));
   // candidate derived paths (PHOENIX_LIB is likely BASIC_JS_LIB or a subdir of CHA/lib)
   var libcands=["pkgs/tv.vidaa.jsservice.basic/CHA/lib",
                 "pkgs/tv.vidaa.jsservice.basic/CHA/lib/phoenix"];
   var targets=["middleware/getFunctionReqInfo.js","middleware/callService.js","serviceManager.js"];
   var seq=[];
   // for each (lc,t) → path "pkgs/...CHA/lib<X>/middleware/getFunctionReqInfo.js"
   for (var i=0;i<libcands.length;i++){ for (var j=0;j<targets.length;j++) seq.push(libcands[i]+"/"+targets[j]); }
   shell.push(function(cb2){
     var di=0;(function n(){ if(di>=seq.length){cb2();return;} var p=seq[di]; report.reads[p]=hr(p); out.textContent+="\n"+p+": "+(report.reads[p].ok?"OK":"absent"); di++; setTimeout(n,1300); })(function(){cb();});
   });
   cb();
 });
 // run sequentially
 (function chain(i){ if(i>=shell.length){save();out.textContent+="\n[reported]";return;} shell[i](function(){ setTimeout(function(){chain(i+1);},1300); }); })(0);
})();
</script></body></html>
