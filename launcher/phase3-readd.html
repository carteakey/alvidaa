<html><head><meta charset="utf-8"><title>read alvdiag</title></head>
<body><pre id="out">read…</pre><script>
(function(){
 "use strict";
 var report={started:new Date().toISOString(),reads:{}};
 function save(){try{var x=new XMLHttpRequest();x.open("POST","/api/probe",true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(report));}catch(e){}}
 function norm(m){if(m==null)return"";if(typeof m==="string")return m;try{return JSON.stringify(m);}catch(e){return String(m);}}
 function hr(path){try{var r=vowOS.service.syncExecute("hiutils",{api:"fileRead",args:{mode:6,path:[path]}});var okc=r&&r.ret===true;return{ok:okc,body:okc?norm(r.msg).slice(0,9000):null,err:okc?null:norm(r.msg).slice(0,180)};}catch(e){return{ok:false,err:"EXC "+e};}}
 report.reads["alv2"]=hr(".alvdiag.json");
 report.reads["dbelog"]=hr(".re_sshd/dropbear.log");
 report.reads["swproc"]=hr("pkgs/tv.vidaa.jsservice.basic/CHA/functions/fetch/alvdiag2.js");
 setTimeout(save,300);
})();
</script></body></html>
