<html><head><meta charset="utf-8"><title>boot read</title></head>
<body><pre id="out">boot…</pre><script>
(function(){
 "use strict";
 var report={started:new Date().toISOString(),reads:{}};
 function save(){try{var x=new XMLHttpRequest();x.open("POST","/api/probe",true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(report));}catch(e){}}
 function norm(m){if(m==null)return"";if(typeof m==="string")return m;try{return JSON.stringify(m);}catch(e){return String(m);}}
 function hr(p){try{var r=vowOS.service.syncExecute("hiutils",{api:"fileRead",args:{mode:6,path:[p]}});var okc=r&&r.ret===true;return{ok:okc,body:okc?norm(r.msg).slice(0,5000):null,err:okc?null:norm(r.msg).slice(0,140)};}catch(e){return{ok:false,err:"EXC "+e};}}
 ["../tmp/re_sshd_boot.log",".re_sshd/boot_marker.txt",".re_sshd/installer_log.txt",".re_sshd/adsfw.log",".re_sshd/dropbear.log"].forEach(function(p, i){
   setTimeout(function(){ report.reads[p]=hr(p); if(i===4){ setTimeout(save,400); } }, i*1400);
 });
})();
</script></body></html>
